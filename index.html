<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Radio SMG</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Radio SMG">

  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: #08090c;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #172033 0%, transparent 35%),
        radial-gradient(circle at top right, #111827 0%, transparent 30%),
        linear-gradient(180deg, #08090c 0%, #0d1016 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding-bottom: 115px;
    }

    button,
    input {
      font-family: inherit;
    }

    .topbar {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 18px 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #19c7a3, #1688ff);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(24, 190, 166, 0.20);
    }

    .brand-icon i {
      font-size: 20px;
      color: white;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .brand-text span {
      display: block;
      color: #8d96a6;
      font-size: 11px;
      margin-top: 1px;
    }

    .settings-button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 14px;
      background: rgba(255,255,255,0.07);
      color: #cdd3dc;
      cursor: pointer;
      font-size: 17px;
    }

    .settings-button:active {
      transform: scale(0.94);
    }

    .main {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 5px 16px 30px;
    }

    .section {
      margin-top: 22px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 11px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 750;
      margin: 0;
      letter-spacing: -0.2px;
    }

    .section-subtitle {
      color: #747e8e;
      font-size: 12px;
    }

    .current-card {
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.08),
          rgba(255,255,255,0.025)
        );
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 24px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 17px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.25);
    }

    .current-logo {
      width: 78px;
      height: 78px;
      border-radius: 20px;
      object-fit: contain;
      background: #11151c;
      padding: 8px;
      flex-shrink: 0;
      display: none;
    }

    .current-info {
      min-width: 0;
      flex: 1;
    }

    .current-label {
      color: #6fd8c5;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .current-name {
      font-size: 19px;
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .current-province {
      color: #8b94a3;
      font-size: 12px;
      margin-top: 3px;
    }

    .current-status {
      color: #687384;
      font-size: 11px;
      margin-top: 8px;
    }

    .favorites-scroll {
      display: flex;
      gap: 11px;
      overflow-x: auto;
      padding: 2px 1px 8px;
      scrollbar-width: none;
    }

    .favorites-scroll::-webkit-scrollbar {
      display: none;
    }

    .favorite-card {
      min-width: 125px;
      max-width: 125px;
      padding: 12px;
      border-radius: 18px;
      background: rgba(255,255,255,0.055);
      border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transition: 0.18s;
    }

    .favorite-card:active {
      transform: scale(0.96);
    }

    .favorite-logo {
      width: 62px;
      height: 62px;
      display: block;
      margin: 0 auto 9px;
      border-radius: 17px;
      object-fit: contain;
      background: #11151c;
      padding: 6px;
    }

    .favorite-name {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .favorite-province {
      color: #737d8d;
      font-size: 10px;
      margin-top: 3px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-favorites {
      width: 100%;
      padding: 17px;
      border-radius: 17px;
      background: rgba(255,255,255,0.035);
      border: 1px dashed rgba(255,255,255,0.09);
      color: #7e8795;
      font-size: 12px;
      text-align: center;
    }

    .search-box {
      position: relative;
      margin-bottom: 12px;
    }

    .search-box i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #6e7888;
      font-size: 14px;
    }

    #stationSearch {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.07);
      outline: none;
      border-radius: 16px;
      background: rgba(255,255,255,0.055);
      color: white;
      padding: 13px 15px 13px 42px;
      font-size: 14px;
    }

    #stationSearch::placeholder {
      color: #687384;
    }

    #stationSearch:focus {
      border-color: rgba(25,199,163,0.5);
    }

    .province-filters {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 1px 1px 10px;
      margin-bottom: 2px;
      scrollbar-width: none;
    }

    .province-filters::-webkit-scrollbar {
      display: none;
    }

    .province-filter {
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.045);
      color: #8b95a5;
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.18s;
    }

    .province-filter.active {
      color: white;
      border-color: rgba(25,199,163,0.45);
      background: rgba(25,199,163,0.13);
    }

    .stations-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .station-item {
      width: 100%;
      min-width: 0;
      min-height: 132px;
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,0.055);
      background: rgba(255,255,255,0.045);
      border-radius: 17px;
      padding: 10px;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      grid-template-rows: 52px auto;
      align-items: start;
      column-gap: 9px;
      row-gap: 8px;
      position: relative;
      cursor: pointer;
      transition: 0.18s;
    }

    .station-item:active {
      transform: scale(0.985);
    }

    .station-item.active {
      border-color: rgba(25,199,163,0.45);
      background:
        linear-gradient(
          90deg,
          rgba(25,199,163,0.13),
          rgba(255,255,255,0.045)
        );
    }

    .station-logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      object-fit: contain;
      background: #10141b;
      padding: 5px;
      box-sizing: border-box;
      flex-shrink: 0;
      grid-row: 1;
    }

    .station-info {
      min-width: 0;
      text-align: left;
      padding-right: 0;
      grid-column: 1 / -1;
      grid-row: 2;
    }

    .station-name {
      font-size: 12.5px;
      font-weight: 800;
      line-height: 1.2;
      min-height: 30px;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      overflow-wrap: anywhere;
      padding-right: 1px;
    }

    .station-province {
      color: #788292;
      font-size: 10px;
      line-height: 1.15;
      margin-top: 4px;
      white-space: normal;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .station-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      grid-column: 2;
      grid-row: 1;
      margin-top: 0;
    }

    .favorite-button {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: #657080;
      font-size: 16px;
      cursor: pointer;
    }

    .favorite-button.active {
      color: #ffd45c;
    }

    .station-play {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: #19c7a3;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    #loading {
      text-align: center;
      color: #8993a2;
      font-size: 13px;
      padding: 18px 0;
    }

    #errorMessage {
      display: none;
      color: #ff7777;
      text-align: center;
      font-size: 13px;
      padding: 12px;
    }

    @media (max-width: 380px) {
      .stations-list {
        grid-template-columns: 1fr;
      }

      .station-logo {
        width: 50px;
        height: 50px;
      }

      .station-name {
        font-size: 13px;
      }
    }

    .news-categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 1px 10px;
      scrollbar-width: none;
    }

    .news-categories::-webkit-scrollbar {
      display: none;
    }

    .news-category {
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.045);
      color: #8f99a8;
      border-radius: 20px;
      padding: 8px 13px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.18s;
    }

    .news-category.active {
      background: #19c7a3;
      border-color: #19c7a3;
      color: white;
    }

    .news-category:active {
      transform: scale(0.95);
    }

    .news-card {
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0,0,0,0.22);
    }

    .news-img {
      width: 100%;
      height: 185px;
      display: block;
      object-fit: cover;
      background: #12161d;
    }

    .news-content {
      padding: 15px;
    }

    .news-category-label {
      display: inline-block;
      color: #6fd8c5;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 7px;
    }

    .news-title {
      font-size: 16px;
      line-height: 1.35;
      margin: 0 0 8px;
    }

    .news-desc {
      font-size: 12px;
      line-height: 1.5;
      color: #9ba4b2;
      margin: 0 0 12px;
    }

    .news-link {
      color: #55b9ff;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    .news-empty {
      padding: 20px;
      text-align: center;
      color: #7e8795;
      font-size: 12px;
      background: rgba(255,255,255,0.035);
      border-radius: 17px;
    }

    /* =========================================================
       FOOTBALL
    ========================================================= */

    .football-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .football-card {
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 12px;
    }

    .football-card.live {
      border-color: rgba(255,80,80,0.35);
    }

    .football-date {
      color: #737e8e;
      font-size: 10px;
      text-align: center;
      margin-bottom: 10px;
    }

    .football-league {
      color: #6fd8c5;
      font-size: 9px;
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 5px;
    }

    .football-teams {
      display: grid;
      grid-template-columns: 1fr 72px 1fr;
      align-items: center;
      gap: 8px;
    }

    .football-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-width: 0;
    }

    .football-team-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .football-team-name {
      font-size: 11px;
      font-weight: 700;
      line-height: 1.25;
    }

    .football-score {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
    }

    .football-score small {
      display: block;
      font-size: 9px;
      font-weight: 600;
      color: #7d8796;
      margin-top: 3px;
    }

    .football-status {
      display: inline-block;
      margin-top: 9px;
      padding: 4px 9px;
      border-radius: 20px;
      background: rgba(25,199,163,0.12);
      color: #6fd8c5;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .football-status.live {
      background: rgba(255,80,80,0.14);
      color: #ff7d7d;
    }

    .football-status.finished {
      background: rgba(255,255,255,0.07);
      color: #929baa;
    }

    .football-status.postponed {
      background: rgba(255,190,70,0.13);
      color: #ffc85c;
    }

    .football-more {
      margin-top: 10px;
      color: #657080;
      text-align: center;
      font-size: 10px;
    }

    #player {
      display: none;
    }

    #stationList {
      display: none;
    }

    .bottom-player {
      position: fixed;
      z-index: 1000;
      left: 0;
      right: 0;
      bottom: 0;
      padding:
        10px
        14px
        calc(10px + env(safe-area-inset-bottom));
      background: rgba(10,12,17,0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .bottom-player-inner {
      width: 100%;
      max-width: 700px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mini-logo {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      object-fit: contain;
      background: #151922;
      padding: 5px;
      flex-shrink: 0;
    }

    .mini-info {
      flex: 1;
      min-width: 0;
    }

    .mini-name {
      font-size: 13px;
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-status {
      color: #737e8e;
      font-size: 10px;
      margin-top: 3px;
    }

    .player-button {
      width: 43px;
      height: 43px;
      border: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    #prevButton,
    #nextButton {
      background: rgba(255,255,255,0.08);
      color: #d7dce4;
      font-size: 13px;
    }

    #playButton {
      background: #19c7a3;
      color: white;
      font-size: 16px;
      box-shadow: 0 5px 18px rgba(25,199,163,0.25);
    }

    @media (max-width: 430px) {

      .football-teams {
        grid-template-columns: 1fr 60px 1fr;
      }

      .football-team-name {
        font-size: 10px;
      }

      .football-score {
        font-size: 16px;
      }

    }

  </style>
</head>

<body>

<header class="topbar">

  <div class="brand">

    <div class="brand-icon">
      <i class="fa-solid fa-radio"></i>
    </div>

    <div class="brand-text">
      <h1>Radio SMG</h1>
      <span>Tu radio, estés donde estés</span>
    </div>

  </div>

  <button
    class="settings-button"
    id="settingsButton"
    aria-label="Configuración"
  >
    <i class="fa-solid fa-gear"></i>
  </button>

</header>


<main class="main">

  <section class="section">

    <div class="current-card">

      <img
        id="stationLogo"
        class="current-logo"
        src=""
        alt="Logo emisora"
      >

      <div class="current-info">

        <div class="current-label">
          <i class="fa-solid fa-circle"></i>
          Radio seleccionada
        </div>

        <div
          id="currentName"
          class="current-name"
        >
          Seleccioná una emisora
        </div>

        <div
          id="currentProvince"
          class="current-province"
        >
          -
        </div>

        <div
          id="nowPlaying"
          class="current-status"
        >
          Lista para reproducir
        </div>

      </div>

    </div>

  </section>


  <section class="section">

    <div class="section-header">

      <h2 class="section-title">
        ⭐ Tus radios favoritas
      </h2>

    </div>

    <div
      id="favoritesContainer"
      class="favorites-scroll"
    ></div>

  </section>


  <section class="section">

    <div class="section-header">

      <h2 class="section-title">
        📻 Todas las radios
      </h2>

      <span
        id="radioCount"
        class="section-subtitle"
      ></span>

    </div>

    <div class="search-box">

      <i class="fa-solid fa-magnifying-glass"></i>

      <input
        type="search"
        id="stationSearch"
        placeholder="Buscar emisora..."
        autocomplete="off"
      >

    </div>

    <div
      id="provinceFilters"
      class="province-filters"
    ></div>

    <div id="loading">
      Cargando emisoras...
    </div>

    <div id="errorMessage"></div>

    <div
      id="stationsContainer"
      class="stations-list"
    ></div>

  </section>


  <section class="section">

    <div class="section-header">

      <h2 class="section-title">
        ⚽ Fútbol
      </h2>

      <span
        id="footballStatus"
        class="section-subtitle"
      >
        2026
      </span>

    </div>

    <div id="footballContainer">

      <div class="news-empty">
        Cargando partidos...
      </div>

    </div>

  </section>


  <section class="section">

    <div class="section-header">

      <h2 class="section-title">
        📰 Noticias
      </h2>

    </div>

    <div
      id="newsCategories"
      class="news-categories"
    >

      <button
        class="news-category active"
        data-category="todas"
      >
        Todas
      </button>

      <button
        class="news-category"
        data-category="actualidad"
      >
        Actualidad
      </button>

      <button
        class="news-category"
        data-category="politica"
      >
        Política
      </button>

      <button
        class="news-category"
        data-category="economia"
      >
        Economía
      </button>

      <button
        class="news-category"
        data-category="deportes"
      >
        Deportes
      </button>

      <button
        class="news-category"
        data-category="tecnologia"
      >
        Tecnología
      </button>

      <button
        class="news-category"
        data-category="espectaculos"
      >
        Espectáculos
      </button>

      <button
        class="news-category"
        data-category="policiales"
      >
        Policiales
      </button>

    </div>

    <div id="news-container"></div>

  </section>

</main>


<select id="stationList">
  <option value="">Seleccioná una emisora</option>
</select>


<audio
  id="player"
  preload="none"
  playsinline
></audio>


<div class="bottom-player">

  <div class="bottom-player-inner">

    <img
      id="miniLogo"
      class="mini-logo"
      src="icon.png"
      alt="Radio"
    >

    <div class="mini-info">

      <div
        id="miniName"
        class="mini-name"
      >
        Radio SMG
      </div>

      <div
        id="miniStatus"
        class="mini-status"
      >
        Seleccioná una emisora
      </div>

    </div>

    <button
      id="prevButton"
      class="player-button"
      aria-label="Radio anterior"
    >
      <i class="fa-solid fa-backward-step"></i>
    </button>

    <button
      id="playButton"
      class="player-button"
      aria-label="Reproducir"
    >
      <i class="fa-solid fa-play"></i>
    </button>

    <button
      id="nextButton"
      class="player-button"
      aria-label="Radio siguiente"
    >
      <i class="fa-solid fa-forward-step"></i>
    </button>

  </div>

</div>


<script>

/* ============================================================

/* ============================================================
   LOGOS
============================================================ */

function getLogoUrl(nombreLogo) {

  if (!nombreLogo) {
    return null;
  }

  if (
    nombreLogo.startsWith("http://") ||
    nombreLogo.startsWith("https://")
  ) {
    return nombreLogo;
  }

  return `${SUPABASE_URL}/storage/v1/object/public/${LOGOS_BUCKET}/${encodeURIComponent(nombreLogo)}`;

}


/* ============================================================
   FAVORITOS
============================================================ */

function getFavorites() {

  try {

    const data =
      localStorage.getItem(
        FAVORITES_KEY
      );

    if (!data) {
      return [];
    }

    const result =
      JSON.parse(data);

    return Array.isArray(result)
      ? result
      : [];

  } catch {

    return [];

  }

}


function saveFavorites(favorites) {

  localStorage.setItem(
    FAVORITES_KEY,
    JSON.stringify(favorites)
  );

}


function isFavorite(radioId) {

  return getFavorites()
    .includes(
      String(radioId)
    );

}


function toggleFavorite(radioId) {

  const id =
    String(radioId);

  let favorites =
    getFavorites();

  if (
    favorites.includes(id)
  ) {

    favorites =
      favorites.filter(
        x => x !== id
      );

  } else {

    favorites.push(id);

  }

  saveFavorites(favorites);

  renderFavorites();

  renderStations(
    stationSearch.value
  );

}


/* ============================================================
   CARGAR RADIOS
============================================================ */

async function cargarRadios() {

  loading.style.display =
    "block";

  errorMessage.style.display =
    "none";

  try {

    const { data, error } =
      await supabaseClient
        .from("radios")
        .select(
          "id, descripcion, provincia, enlace, logo, codigo"
        )
        .order(
          "codigo",
          {
            ascending: true
          }
        );

    if (error) {
      throw error;
    }

    if (
      !data ||
      data.length === 0
    ) {

      throw new Error(
        "No se encontraron emisoras."
      );

    }

    radios =
      data;

    list.innerHTML =
      "";

    radios.forEach(
      radio => {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          radio.enlace || "";

        option.textContent =
          `${radio.descripcion} - ${radio.provincia}`;

        option.dataset.logo =
          getLogoUrl(
            radio.logo
          );

        option.dataset.id =
          radio.id;

        option.dataset.codigo =
          radio.codigo;

        option.dataset.descripcion =
          radio.descripcion;

        option.dataset.provincia =
          radio.provincia;

        list.appendChild(
          option
        );

      }
    );

    loading.style.display =
      "none";

    radioCount.textContent =
      `${radios.length} emisoras`;

    const lastStation =
      localStorage.getItem(
        "lastStation"
      );

    if (lastStation) {

      const index =
        radios.findIndex(
          radio =>
            radio.enlace ===
            lastStation
        );

      if (index >= 0) {

        list.selectedIndex =
          index;

      }

    }

    if (
      list.selectedIndex < 0 &&
      radios.length > 0
    ) {

      list.selectedIndex =
        0;

    }

    actualizarInterfazRadio();

    renderProvinceFilters();

    renderFavorites();

    renderStations();

  } catch (error) {

    console.error(
      "Error cargando radios:",
      error
    );

    loading.style.display =
      "none";

    errorMessage.textContent =
      "No se pudieron cargar las emisoras.";

    errorMessage.style.display =
      "block";

  }

}

============================================================ */

  if (!logo) {

      "none";

    miniLogo.src =
      "icon.png";

    return;

  }

  logoImg.onload =
    function() {

      logoImg.style.display =
        "block";

    };

  logoImg.onerror =
    function() {

      logoImg.style.display =
        "none";

      miniLogo.src =
        "icon.png";

    };

  logoImg.src =
    logo;

  miniLogo.src =
    logo;

}

/* ============================================================
   METADATA LA 100
============================================================ */

async function actualizarMetadata(radio) {

  if (!radio) {
    return;
  }

  if (
    (
      radio.descripcion ||
      ""
    ).toUpperCase() !==
    "LA 100"
  ) {

    return;

  }

  try {

    const url =
      `${TRITON_NOW_PLAYING_URL}?mountName=${METADATA_LA100}&numberToFetch=5&eventType=track`;

    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      return;
    }

    const xmlText =
      await response.text();

    const parser =
      new DOMParser();

    const xml =
      parser.parseFromString(
        xmlText,
        "application/xml"
      );

    const registros =
      Array.from(
        xml.querySelectorAll(
          "nowplaying-info"
        )
      );

    if (
      registros.length === 0
    ) {
      return;
    }

    const current =
      getCurrentRadio();

    if (
      !current ||
      current.id !== radio.id
    ) {
      return;
    }

    const primero =
      registros[0];

    const propiedad =
      primero.querySelector(
        'property[name="cue_title"]'
      );

    if (!propiedad) {
      return;
    }

    const titulo =
      propiedad.textContent.trim();

    if (!titulo) {
      return;
    }

    const programaMatch =
      titulo.match(
        /^\d{2}-\d{2}\s+\d{1,2}HS\s+AIRE\s+(.+?)\s+\d{3}$/i
      );

    if (programaMatch) {

      const programa =
        programaMatch[1].trim();

      if (
        programa.toUpperCase() ===
        "LOOP 30 SEGUNDOS"
      ) {
        return;
      }

      nowPlaying.innerHTML =
        `<span>📻 ${escapeHtml(programa)}</span>`;

      miniStatus.textContent =
        `📻 ${programa}`;

    }

  } catch (error) {

    console.warn(
      "Metadata no disponible:",
      error
    );

  }

}


function iniciarMetadata(radio) {

  detenerMetadata();

  if (!radio) {
    return;
  }

  actualizarMetadata(
    radio
  );

  metadataTimer =
    setInterval(
      () => {

        if (!player.paused) {

          const current =
            getCurrentRadio();

          if (current) {

            actualizarMetadata(
              current
            );

          }

        }

      },
      METADATA_INTERVAL
    );

}


function detenerMetadata() {

  if (metadataTimer) {

    clearInterval(
      metadataTimer
    );

    metadataTimer =
      null;

  }

}


/* ============================================================
   REPRODUCIR
============================================================ */

function playStation(radio) {

  if (
    !radio ||
    !radio.enlace
  ) {
    return;
  }

  nowPlaying.innerHTML =
    "";

  // Indicamos inmediatamente que estamos conectando.
  miniStatus.textContent = "Conectando...";

  const originalUrl =
    radio.enlace;

  const streamUrl =
    WORKER_URL +
    encodeURIComponent(
      originalUrl
    );

  player.pause();

  player.src =
    streamUrl;

  player.load();

  player.play()
    .then(
      () => {

        localStorage.setItem(
          "lastStation",
          radio.enlace
        );

        localStorage.setItem(
          "lastName",
          radio.descripcion || ""
        );

        localStorage.setItem(
          "lastLogo",
          radio.logo || ""
        );

        mostrarLogo(
          radio.logo
        );

        actualizarInterfazRadio();

        miniStatus.textContent =
          "Reproduciendo";

        playButton.innerHTML =
          `<i class="fa-solid fa-pause"></i>`;

        playButton.setAttribute(
          "aria-label",
          "Pausar"
        );

        updateMediaSession(
          radio.descripcion,
          getLogoUrl(
            radio.logo
          )
        );

        iniciarMetadata(
          radio
        );

        renderStations(
          stationSearch.value
        );

      }
    )
    .catch(
      error => {

        console.error(
          "Error al reproducir:",
          error
        );

        miniStatus.textContent =
          "No se pudo reproducir";

        playButton.innerHTML =
          `<i class="fa-solid fa-play"></i>`;

      }
    );

}


/* ============================================================
   PAUSAR
============================================================ */

function pauseStation() {

  player.pause();

  detenerMetadata();

  nowPlaying.innerHTML =
    "";

  playButton.innerHTML =
    `<i class="fa-solid fa-play"></i>`;

  playButton.setAttribute(
    "aria-label",
    "Reproducir"
  );

  miniStatus.textContent =
    "Pausada";

  if (
    "mediaSession" in navigator
  ) {

    navigator.mediaSession.playbackState =
      "paused";

  }

}


/* ============================================================
   PLAY / PAUSE
============================================================ */

playButton.addEventListener(
  "click",
  () => {

    const radio =
      getCurrentRadio();

    if (!radio) {

      alert(
        "Seleccioná una emisora."
      );

      return;

    }

    if (player.paused) {

      if (!player.src) {

        playStation(
          radio
        );

        return;

      }

      player.play()
        .then(
          () => {

            playButton.innerHTML =
              `<i class="fa-solid fa-pause"></i>`;

            playButton.setAttribute(
              "aria-label",
              "Pausar"
            );

            miniStatus.textContent =
              "Reproduciendo";

            updateMediaSession(
              radio.descripcion,
              getLogoUrl(
                radio.logo
              )
            );

            iniciarMetadata(
              radio
            );

          }
        );

    } else {

      pauseStation();

    }

  }
);


/* ============================================================
   CAMBIO DE RADIO
============================================================ */

list.addEventListener(
  "change",
  () => {

    const radio =
      getCurrentRadio();

    if (!radio) {
      return;
    }

    actualizarInterfazRadio();

    playStation(
      radio
    );

  }
);


/* ============================================================
   ANTERIOR / SIGUIENTE
============================================================ */

function playByIndex(index) {

  if (
    radios.length === 0
  ) {
    return;
  }

  if (index < 0) {
    index =
      radios.length - 1;
  }

  if (
    index >= radios.length
  ) {
    index = 0;
  }

  list.selectedIndex =
    index;

  playStation(
    radios[index]
  );

}


nextButton.addEventListener(
  "click",
  () => {

    let nextIndex =
      list.selectedIndex + 1;

    if (
      nextIndex >= radios.length
    ) {
      nextIndex = 0;
    }

    playByIndex(
      nextIndex
    );

  }
);


prevButton.addEventListener(
  "click",
  () => {

    let prevIndex =
      list.selectedIndex - 1;

    if (prevIndex < 0) {
      prevIndex =
        radios.length - 1;
    }

    playByIndex(
      prevIndex
    );

  }
);

/* ============================================================
   MEDIA SESSION
============================================================ */

function updateMediaSession(
  title,
  artwork
) {

  if (
    !("mediaSession" in navigator)
  ) {
    return;
  }

  try {

    navigator.mediaSession.metadata =
      new MediaMetadata({

        title:
          title ||
          "Radio SMG",

        artist:
          "Radio SMG",

        album:
          "Radio Online",

        artwork: [
          {
            src:
              getSafeLogo(
                artwork ||
                "icon.png"
              ),
            sizes:
              "512x512",
            type:
              "image/png"
          }
        ]

      });

    navigator.mediaSession.playbackState =
      player.paused
        ? "paused"
        : "playing";


    try {

      navigator.mediaSession.setActionHandler(
        "play",
        () => {

          const radio =
            getCurrentRadio();

          if (!radio) {
            return;
          }

          player.play()
            .then(
              () => {

                miniStatus.textContent =
                  "Reproduciendo";

                playButton.innerHTML =
                  `<i class="fa-solid fa-pause"></i>`;

                iniciarMetadata(
                  radio
                );

              }
            );

        }
      );

    } catch {}


    try {

      navigator.mediaSession.setActionHandler(
        "pause",
        () => {

          pauseStation();

        }
      );

    } catch {}


    try {

      navigator.mediaSession.setActionHandler(
        "nexttrack",
        () => {

          let nextIndex =
            list.selectedIndex + 1;

          if (
            nextIndex >= radios.length
          ) {
            nextIndex = 0;
          }

          playByIndex(
            nextIndex
          );

        }
      );

    } catch {}


    try {

      navigator.mediaSession.setActionHandler(
        "previoustrack",
        () => {

          let prevIndex =
            list.selectedIndex - 1;

          if (
            prevIndex < 0
          ) {
            prevIndex =
              radios.length - 1;
          }

          playByIndex(
            prevIndex
          );

        }
      );

    } catch {}

  } catch (error) {

    console.warn(
      "MediaSession no disponible:",
      error
    );

  }

}

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text == null
      ? ""
      : String(text);

  return div.innerHTML;

}


function escapeAttribute(text) {

  return escapeHtml(
    text
  ).replace(
    /"/g,
    "&quot;"
  );

}

/* ============================================================
   NORMALIZAR TEXTO
============================================================ */

function limpiarTexto(texto) {

  return String(
    texto || ""
  )
    .replace(
      /<[^>]*>/g,
      ""
    )
    .replace(
      /&nbsp;/gi,
      " "
    )
    .replace(
      /&amp;/gi,
      "&"
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();

}


function normalizarTexto(texto) {

  return limpiarTexto(
    texto
  )
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    );

}

      })
    );

/* ============================================================
   MERGE NOTICIAS
============================================================ */

function fusionarNoticias(
  nuevasNoticias
) {

  const mapa =
    new Map();

  noticias.forEach(
    noticia => {

      mapa.set(
        obtenerClaveNoticia(
          noticia
        ),
        noticia
      );

    }
  );

  nuevasNoticias.forEach(
    noticia => {

      mapa.set(
        obtenerClaveNoticia(
          noticia
        ),
        noticia
      );

    }
  );

  noticias =
    Array.from(
      mapa.values()
    )
    .sort(
      (a, b) => {

        const fechaA =
          Date.parse(
            a.pubDate || ""
          ) || 0;

        const fechaB =
          Date.parse(
            b.pubDate || ""
          ) || 0;

        return fechaB - fechaA;

      }
    )
    .slice(
      0,
      NEWS_MAX_ITEMS
    );

  guardarCacheNoticias();

}


/* ============================================================
   CARGAR NOTICIAS
============================================================ */

async function cargarNoticias() {

  const newsDataUrl =
    `https://newsdata.io/api/1/latest?apikey=${apiKey}&country=ar&language=es`;

  const clarinUrl =
    "https://api.rss2json.com/v1/api.json?rss_url=https://www.clarin.com/rss/lo-ultimo/";


  const resultados =
    await Promise.allSettled([

      fetch(
        newsDataUrl,
        {
          cache: "no-store"
        }
      )
      .then(
        response => {

          if (!response.ok) {
            throw new Error(
              `NewsData HTTP ${response.status}`
            );
          }

          return response.json();

        }
      ),

      fetch(
        clarinUrl,
        {
          cache: "no-store"
        }
      )
      .then(
        response => {

          if (!response.ok) {
            throw new Error(
              `Clarín HTTP ${response.status}`
            );
          }

          return response.json();

        }
      )

    ]);


  const nuevasNoticias = [];


  const newsDataResult =
    resultados[0];


  if (
    newsDataResult.status ===
    "fulfilled"
  ) {

    const data =
      newsDataResult.value;

    if (
      Array.isArray(
        data.results
      )
    ) {

      data.results.forEach(
        n => {

          const noticia = {

            title:
              limpiarTexto(
                n.title ||
                "Sin título"
              ),

            description:
              limpiarTexto(
                n.description ||
                ""
              ).slice(
                0,
                160
              ),

            image_url:
              n.image_url ||
              "icon.png",

            link:
              n.link ||
              "#",

            pubDate:
              n.pubDate ||
              "",

            source:
              n.source_name ||
              "NewsData",

            categoria:
              mapearCategoriaNewsData(
                n.category,
                n
              )

          };

          nuevasNoticias.push(
            noticia
          );

        }
      );

    }

  } else {

    console.warn(
      "NewsData no disponible:",
      newsDataResult.reason
    );

  }


  const clarinResult =
    resultados[1];


  if (
    clarinResult.status ===
    "fulfilled"
  ) {

    const data =
      clarinResult.value;

    if (
      Array.isArray(
        data.items
      )
    ) {

      data.items.forEach(
        n => {

          const noticia = {

            title:
              limpiarTexto(
                n.title ||
                "Sin título"
              ),

            description:
              limpiarTexto(
                n.description ||
                ""
              ).slice(
                0,
                160
              ),

            image_url:
              n.thumbnail ||
              n.enclosure?.link ||
              "icon.png",

            link:
              n.link ||
              "#",

            pubDate:
              n.pubDate ||
              "",

            source:
              "Clarín",

            categoria:
              "actualidad"

          };

          nuevasNoticias.push(
            noticia
          );

        }
      );

    }

  } else {

    console.warn(
      "Clarín no disponible:",
      clarinResult.reason
    );

  }


  if (
    nuevasNoticias.length > 0
  ) {

    fusionarNoticias(
      nuevasNoticias
    );

    indiceNoticia =
      0;

    mostrarNoticia();

  } else {

    if (
      noticias.length === 0
    ) {

      newsContainer.innerHTML = `
        <div class="news-empty">
          No se pudieron cargar las noticias
          en este momento.
        </div>
      `;

    }

  }

}

function getSafeLink(url) {

  try {

    const parsed =
      new URL(
        url,
        location.href
      );

    if (
      parsed.protocol ===
        "http:" ||
      parsed.protocol ===
        "https:"
    ) {

      return parsed.href;

    }

  } catch {}

  return "#";

}

/*
   IMPORTANTE:
   Ahora permitimos leer la caché aunque esté vencida.
   Así, si la API falla, seguimos mostrando los últimos
   partidos conocidos.
*/

function leerCacheFutbol(
  permitirVencida = false
) {

  try {

    const raw =
      localStorage.getItem(
        FOOTBALL_CACHE_KEY
      );

    if (!raw) {
      return null;
    }

    const cache =
      JSON.parse(raw);

    if (
      !cache ||
      !Array.isArray(
        cache.fixtures
      )
    ) {
      return null;
    }

    const edad =
      Date.now() -
      Number(
        cache.timestamp || 0
      );

    if (
      permitirVencida ||
      edad <= FOOTBALL_CACHE_TIME
    ) {

      return cache.fixtures;

    }

    return null;

  } catch (error) {

    console.warn(
      "No se pudo leer caché fútbol:",
      error
    );

    return null;

  }

}


function guardarCacheFutbol(

) {

  try {

    localStorage.setItem(
      FOOTBALL_CACHE_KEY,
      JSON.stringify({

        timestamp:
          Date.now(),

    );

  } catch (error) {

) {

    "BT",
    "P"
  ].includes(
    status
  );

}


function esPartidoFinalizado(
  status
) {

  return [
    "FT",
    "AET",
    "PEN",
    "AWD",
    "WO"
  ].includes(
    status
  );

}

/* ============================================================
   FÚTBOL - RENDER
============================================================ */

function renderFutbol(
  fixtures
) {

  if (
    !Array.isArray(
      fixtures
    ) ||
    fixtures.length === 0
  ) {

    footballContainer.innerHTML = `
      <div class="news-empty">
        La API respondió correctamente,
        pero no hay partidos disponibles
        para esta competencia y temporada.
      </div>
    `;

    return;

  }

  const ahora =
    Date.now();

  const ordenados =
    [...fixtures].sort(
      (a, b) => {

        const fechaA =
          new Date(
            a?.fixture?.date || 0
          ).getTime();

        const fechaB =
          new Date(
            b?.fixture?.date || 0
          ).getTime();

        return fechaA - fechaB;

      }
    );


  const enVivo =
    ordenados.filter(
      partido =>
        esPartidoEnVivo(
          partido?.fixture?.status?.short
        )
    );


  const proximos =
    ordenados.filter(
      partido => {

        const fecha =
          new Date(
            partido?.fixture?.date || 0
          ).getTime();

        const status =
          partido?.fixture?.status?.short;

        return (
          fecha >= ahora &&
          !esPartidoEnVivo(status) &&
          !esPartidoFinalizado(status)
        );

      }
    );


  const finalizados =
    ordenados
      .filter(
        partido => {

          const fecha =
            new Date(
              partido?.fixture?.date || 0
            ).getTime();

          return (
            fecha < ahora &&
            esPartidoFinalizado(
              partido?.fixture?.status?.short
            )
          );

        }
      )
      .sort(
        (a, b) =>
          new Date(
            b.fixture.date
          ) -
          new Date(
            a.fixture.date
          )
      );


  const seleccionados = [
    ...enVivo,
    ...proximos.slice(0, 5),
    ...finalizados.slice(0, 3)
  ];


  const unicos = [];

  const ids =
    new Set();


  seleccionados.forEach(
    partido => {

      const id =
        partido?.fixture?.id;

      if (
        id &&
        !ids.has(id)
      ) {

        ids.add(id);

        unicos.push(
          partido
        );

      }

    }
  );


  if (
    unicos.length === 0
  ) {

    footballContainer.innerHTML = `
      <div class="news-empty">
        No hay partidos próximos o recientes
        para mostrar.
      </div>
    `;

    return;

  }


  const nombreLiga =
    unicos[0]?.league?.name ||
    "Fútbol";


  footballStatus.textContent =
    `${nombreLiga} · 2026`;


  footballContainer.innerHTML = `

    <div class="football-list">

      ${unicos.map(
        partido => {

          const fixture =
            partido.fixture || {};

          const home =
            partido.teams?.home || {};

          const away =
            partido.teams?.away || {};

          const golesHome =
            partido.goals?.home;

          const golesAway =
            partido.goals?.away;

          const status =
            fixture.status?.short ||
            "NS";

          const estado =
            textoEstadoFutbol(
              status
            );

          const live =
            esPartidoEnVivo(
              status
            );

          const finished =
            esPartidoFinalizado(
              status
            );

          let score =
            "vs";

          if (
            finished ||
            live
          ) {

            score =
              `${golesHome ?? 0} - ${golesAway ?? 0}`;

          }


          let statusClass =
            "";

          if (live) {

            statusClass =
              "live";

          } else if (finished) {

            statusClass =
              "finished";

          } else if (
            status === "PST" ||
            status === "CANC" ||
            status === "ABD"
          ) {

            statusClass =
              "postponed";

          }


          return `

            <article
              class="football-card ${live ? "live" : ""}"
            >

              <div class="football-league">
                ${escapeHtml(
                  partido?.league?.name ||
                  "Fútbol"
                )}
              </div>

              <div class="football-date">
                ${escapeHtml(
                  formatearFechaFutbol(
                    fixture.date
                  )
                )}
              </div>

              <div class="football-teams">

                <div class="football-team">

                  <img
                    class="football-team-logo"
                    src="${escapeAttribute(
                      home.logo ||
                      "icon.png"
                    )}"
                    alt=""
                    onerror="this.src='icon.png'"
                  >

                  <div class="football-team-name">
                    ${escapeHtml(
                      home.name ||
                      "Local"
                    )}
                  </div>

                </div>


                <div class="football-score">

                  ${escapeHtml(
                    score
                  )}

                  <small>
                    ${escapeHtml(
                      estado
                    )}
                  </small>

                </div>


                <div class="football-team">

                  <img
                    class="football-team-logo"
                    src="${escapeAttribute(
                      away.logo ||
                      "icon.png"
                    )}"
                    alt=""
                    onerror="this.src='icon.png'"
                  >

                  <div class="football-team-name">
                    ${escapeHtml(
                      away.name ||
                      "Visitante"
                    )}
                  </div>

                </div>

              </div>


              <div style="text-align:center;">

                <span
                  class="football-status ${statusClass}"
                >
                  ${escapeHtml(
                    estado
                  )}
                </span>

              </div>

            </article>

          `;

        }
      ).join("")}

    </div>

    ${
      fixtures.length > 8
        ? `
          <div class="football-more">
            Mostrando próximos y últimos partidos.
          </div>
        `
        : ""
    }

  `;

}


/* ============================================================
   FÚTBOL - ERROR THE SPORTS DB
============================================================ */

function obtenerMensajeErrorFootball(
  data,
  response
) {

  if (
    data &&
    data.message
  ) {

    return String(
      data.message
    );

  }

  if (
    response &&
    response.status
  ) {

    return `HTTP ${response.status}`;

  }

  return "Error desconocido de TheSportsDB.";

}


/* ============================================================
   FÚTBOL - CONVERTIR DATOS THE SPORTS DB
============================================================ */

function convertirEventoFootball(
  evento
) {

  if (!evento) {
    return null;
  }

  const fecha =
    evento.strTimestamp ||
    (
      evento.dateEventLocal &&
      evento.strTimeLocal
        ? `${evento.dateEventLocal}T${evento.strTimeLocal}`
        : evento.dateEvent
    );

  let status =
    "NS";

  const estado =
    String(
      evento.strStatus ||
      ""
    ).toUpperCase();

  if (
    estado === "FT" ||
    estado === "AET" ||
    estado === "PEN" ||
    estado === "AWD" ||
    estado === "WO"
  ) {

    status = estado;

  } else if (
    estado === "1H" ||
    estado === "HT" ||
    estado === "2H" ||
    estado === "ET" ||
    estado === "BT" ||
    estado === "P"
  ) {

    status = estado;

  } else if (
    estado === "PST" ||
    estado === "CANC" ||
    estado === "ABD"
  ) {

    status = estado;

  } else if (
    String(
      evento.strPostponed ||
      ""
    ).toLowerCase() === "yes"
  ) {

    status = "PST";

  } else {

    status = "NS";

  }

  const golesHome =
    evento.intHomeScore !== null &&
    evento.intHomeScore !== undefined &&
    evento.intHomeScore !== ""
      ? Number(evento.intHomeScore)
      : null;

  const golesAway =
    evento.intAwayScore !== null &&
    evento.intAwayScore !== undefined &&
    evento.intAwayScore !== ""
      ? Number(evento.intAwayScore)
      : null;

  return {

    fixture: {

      id:
        evento.idEvent,

      date:
        fecha,

      status: {

        short:
          status,

        long:
          evento.strStatus ||
          status

      }

    },

    league: {

      id:
        evento.idLeague,

      name:
        evento.strLeague ||
        "Argentinian Primera Division",

      season:
        evento.strSeason ||
        THESPORTSDB_SEASON

    },

    teams: {

      home: {

        id:
          evento.idHomeTeam,

        name:
          evento.strHomeTeam ||
          "Local",

        logo:
          evento.strHomeTeamBadge ||
          "icon.png"

      },

      away: {

        id:
          evento.idAwayTeam,

        name:
          evento.strAwayTeam ||
          "Visitante",

        logo:
          evento.strAwayTeamBadge ||
          "icon.png"

      }

    },

    goals: {

      home:
        golesHome,

      away:
        golesAway

    }

  };

}


/* ============================================================
   FÚTBOL - CARGAR THE SPORTS DB
============================================================ */

async function cargarFutbol(
  forzar = false
) {

  footballStatus.textContent =
    "Cargando...";


  /*
     Primero usamos caché fresca.
  */

  if (!forzar) {

    const cache =
      leerCacheFutbol(false);

    if (cache) {

      renderFutbol(
        cache
      );

      footballStatus.textContent =
        `${cache[0]?.league?.name || "Fútbol"} · ${THESPORTSDB_SEASON}`;

      return;

    }

  }


  try {

    const url =
      `${THESPORTSDB_BASE}/eventsseason.php` +
      `?id=${THESPORTSDB_LEAGUE}` +
      `&s=${THESPORTSDB_SEASON}`;


    console.log(
      "THESPORTSDB:",
      url
    );


    const response =
      await fetch(
        url,
        {
          method: "GET",

          headers: {

            "Accept":
              "application/json"

          },

          cache:
            "no-store"

        }
      );


    let data =
      null;


    try {

      data =
        await response.json();

    } catch {

      throw new Error(
        `TheSportsDB HTTP ${response.status}: respuesta no válida.`
      );

    }


    console.log(
      "THESPORTSDB RESPONSE:",
      data
    );


    if (
      !response.ok
    ) {

      throw new Error(
        obtenerMensajeErrorFootball(
          data,
          response
        )
      );

    }


    const eventos =
      Array.isArray(
        data?.events
      )
        ? data.events
        : [];


    console.log(
      "EVENTOS RECIBIDOS:",
      eventos.length
    );


    const fixtures =
      eventos
        .map(
          convertirEventoFootball
        )
        .filter(
          partido =>
            partido &&
            partido.fixture &&
            partido.fixture.id &&
            partido.fixture.date
        );


    console.log(
      "PARTIDOS CONVERTIDOS:",
      fixtures.length
    );


    if (
      fixtures.length === 0
    ) {

      const cacheVencida =
        leerCacheFutbol(true);

      if (
        cacheVencida &&
        cacheVencida.length > 0
      ) {

        renderFutbol(
          cacheVencida
        );

        footballStatus.textContent =
          "Datos guardados";

        return;

      }

      footballContainer.innerHTML = `
        <div class="news-empty">

          La API respondió correctamente,
          pero no devolvió partidos para:

          <br><br>

          Liga: ${THESPORTSDB_LEAGUE}<br>
          Temporada: ${THESPORTSDB_SEASON}

          <br><br>

          <span style="font-size:10px;color:#697384;">
            No hay partidos disponibles
            para esta competencia y temporada.
          </span>

        </div>
      `;

      footballStatus.textContent =
        "Sin partidos";

      return;

    }


    /*
       Ordenamos para que el render actual
       pueda encontrar próximos y recientes.
    */

    fixtures.sort(
      (a, b) =>
        new Date(
          a.fixture.date
        ) -
        new Date(
          b.fixture.date
        )
    );


    guardarCacheFutbol(
      fixtures
    );


    renderFutbol(
      fixtures
    );


    footballStatus.textContent =
      `${
        fixtures[0]?.league?.name ||
        "Fútbol"
      } · ${THESPORTSDB_SEASON}`;


  } catch (error) {

    console.error(
      "ERROR COMPLETO THESPORTSDB:",
      error
    );


    const cacheVencida =
      leerCacheFutbol(true);


    if (
      cacheVencida &&
      cacheVencida.length > 0
    ) {

      renderFutbol(
        cacheVencida
      );

      footballStatus.textContent =
        "Datos guardados";

      console.warn(
        "Se utilizaron datos guardados porque TheSportsDB falló:",
        error.message
      );

      return;

    }


    const mensaje =
      error &&
      error.message
        ? error.message
        : "Error desconocido";


    footballContainer.innerHTML = `

      <div class="news-empty">

        <strong>
          No se pudieron cargar los partidos.
        </strong>

        <br><br>

        <span
          style="
            color:#ff8585;
            font-size:11px;
            line-height:1.5;
          "
        >
          ${escapeHtml(
            mensaje
          )}
        </span>

        <br><br>

        <span
          style="
            color:#687384;
            font-size:10px;
            line-height:1.5;
          "
        >
          Liga: ${THESPORTSDB_LEAGUE}<br>
          Temporada: ${THESPORTSDB_SEASON}
        </span>

      </div>

    `;

    footballStatus.textContent =
      "Error API";

  }

}

cargarCacheNoticias();

cargarRadios();
