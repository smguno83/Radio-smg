<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio SMG - Tu música, tus radios</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Radio SMG">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #030712;
      --card-bg: rgba(13, 22, 41, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #0088ff;
      --accent-cyan: #00d4ff;
      --accent-red: #ff3b30;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 102, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(0, 212, 255, 0.08) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding-bottom: 40px;
    }

    .topbar {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 20px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0088ff, #00d4ff);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 136, 255, 0.4);
    }

    .brand-icon i {
      font-size: 22px;
      color: white;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-text h1 span {
      color: var(--accent-blue);
    }

    .brand-text span.tagline {
      display: block;
      color: var(--text-sub);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .top-search-bar {
      flex: 1;
      max-width: 480px;
      position: relative;
    }

    .top-search-bar i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
      font-size: 15px;
    }

    .top-search-bar input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 12px 20px 12px 45px;
      color: white;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }

    .top-search-bar input:focus {
      border-color: var(--accent-blue);
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 0 15px rgba(0, 136, 255, 0.2);
    }

    .theme-toggle {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 20px;
      cursor: pointer;
      padding: 8px;
    }

    .main {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px 20px;
    }

    .player-hero-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 28px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 30px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .hero-left {
      border-right: 1px solid var(--card-border);
      padding-right: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .live-badge {
      position: absolute;
      top: 0;
      right: 10px;
      background: var(--accent-red);
      color: white;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .live-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 50%;
    }

    .hero-radio-logo-container {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
      box-shadow: 0 0 35px rgba(0, 136, 255, 0.3);
      margin-top: 15px;
      margin-bottom: 18px;
    }

    .hero-radio-logo {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #1e293b;
    }

    .hero-radio-title {
      font-size: 18px;
      font-weight: 800;
      margin: 0 0 4px;
      letter-spacing: -0.3px;
    }

    .hero-radio-location {
      color: var(--text-sub);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .hero-right {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .now-playing-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .now-playing-info {
      flex: 1;
    }

    .now-playing-label {
      color: var(--accent-cyan);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .song-title {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 4px;
    }

    .artist-name {
      color: var(--text-sub);
      font-size: 14px;
      margin: 0;
    }

    .album-art {
      width: 110px;
      height: 110px;
      border-radius: 16px;
      object-fit: cover;
      background: #1e293b;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .waveform-visualizer {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 30px;
      margin: 20px 0 10px;
    }

    .wave-bar {
      flex: 1;
      background: var(--accent-blue);
      border-radius: 3px;
      height: 20%;
      transition: height 0.2s;
    }

    .waveform-visualizer.playing .wave-bar {
      animation: wave 1.2s infinite ease-in-out alternate;
    }

    @keyframes wave {
      0% { height: 15%; }
      100% { height: 90%; }
    }

    .waveform-visualizer .wave-bar:nth-child(2n) { animation-delay: 0.2s; }
    .waveform-visualizer .wave-bar:nth-child(3n) { animation-delay: 0.4s; }
    .waveform-visualizer .wave-bar:nth-child(4n) { animation-delay: 0.1s; }
    .waveform-visualizer .wave-bar:nth-child(5n) { animation-delay: 0.3s; }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 15px;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    .control-btn.play-main {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, var(--accent-blue), #0055ff);
      border: none;
      font-size: 20px;
      box-shadow: 0 0 25px rgba(0, 136, 255, 0.5);
    }

    .section-header-flex {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 32px 0 16px;
    }

    .section-title-icon {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      margin: 0;
    }

    .section-title-icon i {
      color: var(--accent-blue);
    }

    .see-all-link {
      color: var(--accent-blue);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .favorites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    .favorite-card-modern {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
    }

    .favorite-card-modern:hover {
      transform: translateY(-5px);
      border-color: rgba(0, 136, 255, 0.4);
      background: rgba(18, 30, 56, 0.85);
    }

    .fav-heart-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      color: var(--accent-red);
      font-size: 14px;
    }

    .fav-logo-wrapper {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
      border: 1px solid var(--card-border);
      margin-bottom: 12px;
    }

    .fav-logo-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #1e293b;
    }

    .fav-title {
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .fav-sub {
      color: var(--text-sub);
      font-size: 11px;
      margin-bottom: 10px;
    }

    .fav-play-btn {
      position: absolute;
      bottom: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent-blue);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      box-shadow: 0 4px 12px rgba(0, 136, 255, 0.4);
      cursor: pointer;
    }

    .app-footer {
      text-align: center;
      margin-top: 40px;
      color: var(--text-sub);
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    @media (max-width: 900px) {
      .player-hero-card {
        grid-template-columns: 1fr;
      }
      .hero-left {
        border-right: none;
        border-bottom: 1px solid var(--card-border);
        padding-right: 0;
        padding-bottom: 20px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">
        <i class="fa-solid fa-radio"></i>
      </div>
      <div class="brand-text">
        <h1>Radio <span>SMG</span></h1>
        <span class="tagline">Tu música, tus radios</span>
      </div>
    </div>

    <div class="top-search-bar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="search" id="stationSearch" placeholder="Buscar radio o provincia..." autocomplete="off">
    </div>

    <button class="theme-toggle" aria-label="Modo Oscuro">
      <i class="fa-regular fa-moon"></i>
    </button>
  </header>

  <main class="main">

    <!-- HERO PLAYER CARD -->
    <section class="player-hero-card">
      <div class="hero-left">
        <div class="live-badge">EN VIVO</div>
        <div class="hero-radio-logo-container">
          <img id="stationLogo" class="hero-radio-logo" src="" alt="Logo Radio">
        </div>
        <h2 id="currentName" class="hero-radio-title">Selecciona una radio</h2>
        <div id="currentProvince" class="hero-radio-location">
          <i class="fa-solid fa-location-dot"></i> --
        </div>
      </div>

      <div class="hero-right">
        <div class="now-playing-header">
          <div class="now-playing-info">
            <div class="now-playing-label">
              <i class="fa-solid fa-signal"></i> AHORA SUENA EN VIVO
            </div>
            <h3 id="songTitle" class="song-title">Cargando Emisora...</h3>
            <p id="artistName" class="artist-name">Transmisión Online</p>
          </div>
          <img id="albumArt" class="album-art" src="" alt="Cover Radio">
        </div>

        <div class="waveform-visualizer" id="visualizer">
          <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        </div>

        <div class="player-controls">
          <button class="control-btn"><i class="fa-regular fa-heart"></i></button>
          <button id="prevButton" class="control-btn"><i class="fa-solid fa-backward-step"></i></button>
          <button id="playButton" class="control-btn play-main"><i class="fa-solid fa-play"></i></button>
          <button id="nextButton" class="control-btn"><i class="fa-solid fa-forward-step"></i></button>
          <button class="control-btn"><i class="fa-solid fa-volume-high"></i></button>
        </div>
      </div>
    </section>

    <!-- RADIOS FAVORITAS -->
    <section>
      <div class="section-header-flex">
        <h3 class="section-title-icon">
          <i class="fa-solid fa-star"></i> Emisoras destacadas
        </h3>
      </div>

      <div class="favorites-grid" id="favoritesContainer"></div>
    </section>

    <footer class="app-footer">
      <strong>Radio SMG</strong> • Tu música, tus radios
    </footer>

  </main>

  <audio id="player" preload="none" playsinline></audio>

  <script>
    // Enlaces de streaming funcionales y estables vía HTTPS
    const stations = [
      {
        id: 1,
        name: "Radio Nacional",
        province: "Buenos Aires",
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Radio_Nacional_Argentina_logo.svg/512px-Radio_Nacional_Argentina_logo.svg.png",
        stream: "https://stream.lra1.radionacional.com.ar/lra1"
      },
      {
        id: 2,
        name: "Radio Sudamericana",
        province: "Corrientes",
        logo: "https://www.radiosudamericana.com/favicon.ico",
        stream: "https://stream.radiosudamericana.com/stream"
      },
      {
        id: 3,
        name: "Radio Disney LA",
        province: "Latinoamérica",
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/Radio_Disney_logo.svg/512px-Radio_Disney_logo.svg.png",
        stream: "https://ic.streamblast.com/radio_disney"
      }
    ];

    let currentIndex = 0;
    const player = document.getElementById("player");
    const playButton = document.getElementById("playButton");
    const prevButton = document.getElementById("prevButton");
    const nextButton = document.getElementById("nextButton");

    const currentName = document.getElementById("currentName");
    const currentProvince = document.getElementById("currentProvince");
    const stationLogo = document.getElementById("stationLogo");
    const albumArt = document.getElementById("albumArt");
    const songTitle = document.getElementById("songTitle");
    const visualizer = document.getElementById("visualizer");
    const favoritesContainer = document.getElementById("favoritesContainer");
    const stationSearch = document.getElementById("stationSearch");

    const defaultImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2'><path d='M4 11a9 9 0 0 1 9 9'/><path d='M4 4a16 16 0 0 1 16 16'/><circle cx='5' cy='19' r='1'/></svg>";

    function renderFavorites(list) {
      favoritesContainer.innerHTML = "";
      list.forEach((st, index) => {
        const card = document.createElement("div");
        card.className = "favorite-card-modern";
        card.innerHTML = `
          <i class="fa-solid fa-heart fav-heart-badge"></i>
          <div class="fav-logo-wrapper">
            <img src="${st.logo}" alt="${st.name}" onerror="this.src='${defaultImg}'">
          </div>
          <div class="fav-title">${st.name}</div>
          <div class="fav-sub">${st.province}</div>
          <button class="fav-play-btn"><i class="fa-solid fa-play"></i></button>
        `;
        card.addEventListener("click", () => {
          currentIndex = index;
          selectAndPlay(currentIndex);
        });
        favoritesContainer.appendChild(card);
      });
    }

    function loadStation(index) {
      const st = stations[index];
      currentName.textContent = st.name;
      currentProvince.innerHTML = `<i class="fa-solid fa-location-dot"></i> ${st.province}`;
      songTitle.textContent = st.name;
      stationLogo.src = st.logo;
      albumArt.src = st.logo;
      
      stationLogo.onerror = () => { stationLogo.src = defaultImg; };
      albumArt.onerror = () => { albumArt.src = defaultImg; };

      player.src = st.stream;
    }

    function selectAndPlay(index) {
      loadStation(index);
      player.play().then(() => {
        updatePlayState(true);
      }).catch(err => {
        console.warn("Autoplay bloqueado por el navegador:", err);
        updatePlayState(false);
      });
    }

    function togglePlay() {
      if (!player.src) {
        loadStation(0);
      }
      if (player.paused) {
        player.play().then(() => updatePlayState(true)).catch(console.error);
      } else {
        player.pause();
        updatePlayState(false);
      }
    }

    function updatePlayState(isPlaying) {
      if (isPlaying) {
        playButton.innerHTML = '<i class="fa-solid fa-pause"></i>';
        visualizer.classList.add("playing");
      } else {
        playButton.innerHTML = '<i class="fa-solid fa-play"></i>';
        visualizer.classList.remove("playing");
      }
    }

    playButton.addEventListener("click", togglePlay);

    prevButton.addEventListener("click", () => {
      currentIndex = (currentIndex - 1 + stations.length) % stations.length;
      selectAndPlay(currentIndex);
    });

    nextButton.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % stations.length;
      selectAndPlay(currentIndex);
    });

    stationSearch.addEventListener("input", (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = stations.filter(st => 
        st.name.toLowerCase().includes(query) || st.province.toLowerCase().includes(query)
      );
      renderFavorites(filtered);
    });

    // Inicialización sin forzar reproducción automática
    renderFavorites(stations);
    loadStation(0);
  </script>
</body>
</html>
