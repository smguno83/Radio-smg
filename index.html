    /* ============================================================
       AJUSTES PARA CELULARES

    @media (max-width: 500px) {

      h1 {

      select {

        width: 96%;

        max-width: none;

        width: 96%;

        font-size: 0.9rem;

        width: 96%;
      }


      img#stationLogo {

        width: 90px;

<script>


/* ============================================================
   SUPABASE
   ============================================================ */

const SUPABASE_URL =
  "https://kzcnkktttazibhnqfxvq.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_stHEaVggW8TWfKMrTOW0OQ_QoOB4y8f";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* ============================================================
   CONFIGURACIÓN
   ============================================================ */

const WORKER_URL =
  "https://cool-fire-ed4b.matiasgutierrez402.workers.dev/?url=";


const LOGOS_BUCKET =
  "logos";


/* ============================================================
   CONFIGURACIÓN DE METADATA
   ============================================================ */

const TRITON_NOW_PLAYING_URL =
  "https://np.tritondigital.com/public/nowplaying";


/*
   LA 100 utiliza el mountName FM999_56AAC.
*/

const METADATA_LA100 =
  "FM999_56AAC";


/*
   Intervalo de actualización:
   30 segundos.
*/

const METADATA_INTERVAL =
  30000;


/* ============================================================
   VARIABLES
   ============================================================ */

const player =
  document.getElementById('player');


const list =
  document.getElementById('stationList');


const playButton =
  document.getElementById('playButton');


const logoImg =
  document.getElementById('stationLogo');


const prevButton =
  document.getElementById('prevButton');


const nextButton =
  document.getElementById('nextButton');


const loading =
  document.getElementById('loading');


const errorMessage =
  document.getElementById('errorMessage');


const nowPlaying =
  document.getElementById('nowPlaying');


let radios = [];


/* ============================================================
   LOGOS
   ============================================================ */

function getLogoUrl(nombreLogo) {

  if (!nombreLogo) {
    return null;
  }


  if (
    nombreLogo.startsWith("http://") ||
    nombreLogo.startsWith("https://")
  ) {

    return nombreLogo;

  }


  return `${SUPABASE_URL}/storage/v1/object/public/${LOGOS_BUCKET}/${encodeURIComponent(nombreLogo)}`;

}


/* ============================================================
   CARGAR RADIOS
   ============================================================ */

async function cargarRadios() {

  loading.style.display =
    "block";

  errorMessage.style.display =
    "none";


  try {

    const { data, error } =
      await supabaseClient
        .from("radios")
        .select(
          "id, descripcion, provincia, enlace, logo, codigo"
        )
        .order(
          "codigo",
          { ascending: true }
        );


    if (error) {
      throw error;
    }


    if (
      !data ||
      data.length === 0
    ) {

      throw new Error(
        "No se encontraron emisoras."
      );

    }


    radios = data;


    list.innerHTML = "";


    radios.forEach((radio) => {

      const option =
        document.createElement("option");


      option.value =
        radio.enlace || "";


      option.textContent =
        `${radio.descripcion} - ${radio.provincia}`;


      option.dataset.logo =
        getLogoUrl(radio.logo);


      option.dataset.id =
        radio.id;


      option.dataset.codigo =
        radio.codigo;


      option.dataset.descripcion =
        radio.descripcion;


      option.dataset.provincia =
        radio.provincia;


      list.appendChild(option);

    });


    loading.style.display =
      "none";


    /* ========================================================
       RECUPERAR ÚLTIMA RADIO
       ======================================================== */

    const lastStation =
      localStorage.getItem(
        "lastStation"
      );


    if (lastStation) {

      const index =
        radios.findIndex(
          radio =>
            radio.enlace === lastStation
        );


      if (index >= 0) {

        list.selectedIndex =
          index;


        const radio =
          radios[index];


        mostrarLogo(
          radio.logo
        );


        /*
           IMPORTANTE:
           NO consultamos metadata acá.
           La radio todavía no está reproduciendo.
        */

        nowPlaying.innerHTML = "";

        return;

      }

    }


    /* ========================================================
       PRIMERA RADIO
       ======================================================== */

    if (radios.length > 0) {

      list.selectedIndex =
        0;


      const radio =
        radios[0];


      mostrarLogo(
        radio.logo
      );


      /*
         IMPORTANTE:
         Solo mostramos el logo.
         No consultamos metadata porque
         todavía no se está reproduciendo.
      */

      nowPlaying.innerHTML = "";

    }


  } catch (error) {

    console.error(
      "Error cargando radios desde Supabase:",
      error
    );


    loading.style.display =
      "none";


    errorMessage.textContent =
      "No se pudieron cargar las emisoras.";


    errorMessage.style.display =
      "block";

  }

}


/* ============================================================
   MOSTRAR LOGO
   ============================================================ */

function mostrarLogo(nombreLogo) {

  const logo =
    getLogoUrl(nombreLogo);


  if (!logo) {

    logoImg.src = "";

    logoImg.style.display =
      "none";

    return;

  }


  logoImg.onload =
    function() {

      logoImg.style.display =
        "block";

    };


  logoImg.onerror =
    function() {

      logoImg.style.display =
        "none";

    };


  logoImg.src =
    logo;

}


/* ============================================================
   RADIO ACTUAL
   ============================================================ */

function getCurrentRadio() {

  const index =
    list.selectedIndex;


  if (
    index < 0 ||
    index >= radios.length
  ) {

    return null;

  }


  return radios[index];

}


/* ============================================================
   METADATA - LA 100
   ============================================================ */

async function actualizarMetadata(radio) {

  /*
     SI NO ESTÁ REPRODUCIENDO,
     NO MOSTRAMOS NADA.

     Esto evita que aparezca el programa
     apenas se abre la página.
  */

  if (
    !radio ||
    radio.descripcion.toUpperCase() !== "LA 100" ||
    player.paused
  ) {

    nowPlaying.innerHTML = "";

    return;

  }


  try {

    const url =
      `${TRITON_NOW_PLAYING_URL}?mountName=${METADATA_LA100}&numberToFetch=5&eventType=track`;


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const xmlText =
      await response.text();


    const parser =
      new DOMParser();


    const xml =
      parser.parseFromString(
        xmlText,
        "application/xml"
      );


    const registros =
      Array.from(
        xml.querySelectorAll(
          "nowplaying-info"
        )
      );


    if (
      registros.length === 0
    ) {

      nowPlaying.innerHTML = "";

      return;

    }


    /*
       Antes de mostrar la metadata,
       verificamos nuevamente que siga
       reproduciendo.

       Esto evita que una respuesta tardía
       aparezca después de haber pausado.
    */

    if (player.paused) {

      nowPlaying.innerHTML = "";

      return;

    }


    /*
       Tomamos el registro más reciente.
    */

    const primero =
      registros[0];


    const propiedad =
      primero.querySelector(
        'property[name="cue_title"]'
      );


    if (!propiedad) {

      nowPlaying.innerHTML = "";

      return;

    }


    let titulo =
      propiedad.textContent.trim();


    if (!titulo) {

      nowPlaying.innerHTML = "";

      return;

    }


    /* ========================================================
       DETECTAR PROGRAMAS DE LA 100
       ========================================================

       Ejemplo:

       10-09 14HS AIRE SARASA 002

       Se convierte en:

       📻 Programa: SARASA
    */


    const programaMatch =
      titulo.match(
        /^\d{2}-\d{2}\s+\d{1,2}HS\s+AIRE\s+(.+?)\s+\d{3}$/i
      );


    if (programaMatch) {

      let programa =
        programaMatch[1].trim();


      /*
         Evitar mostrar contenido
         técnico como programa.
      */

      if (
        programa.toUpperCase() ===
        "LOOP 30 SEGUNDOS"
      ) {

        nowPlaying.innerHTML =
          "";

        return;

      }


      nowPlaying.innerHTML =
        `<span class="programa">📻 Programa: ${escapeHtml(programa)}</span>`;


      return;

    }


    /*
       LOOP no se muestra.
    */

    if (
      titulo.toUpperCase().includes(
        "LOOP"
      )
    ) {

      nowPlaying.innerHTML =
        "";

      return;

    }


    /*
       Si todavía no sabemos interpretar
       el contenido, no mostramos nada.
    */

    nowPlaying.innerHTML =
      "";

  } catch (error) {

    console.warn(
      "No se pudo obtener metadata de LA 100:",
      error
    );

    /*
       La metadata no debe afectar
       la reproducción.
    */

  }

}


/* ============================================================
   ESCAPAR HTML
   ============================================================ */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}


/* ============================================================
   ACTUALIZAR METADATA PERIÓDICAMENTE
   ============================================================ */

setInterval(
  () => {

    const radio =
      getCurrentRadio();


    /*
       La función actualizarMetadata()
       verifica si realmente está reproduciendo.

       Por lo tanto, este intervalo no mostrará
       nada mientras la radio esté pausada.
    */

    if (radio) {

      actualizarMetadata(
        radio
      );

    }

  },
  METADATA_INTERVAL
);


/* ============================================================
   REPRODUCIR
   ============================================================ */

function playStation(radio) {

  if (
    !radio ||
    !radio.enlace
  ) {

    return;

  }


  /*
     Limpiar inmediatamente la metadata anterior.

     Esto es importante cuando cambiamos
     de una radio a otra.
  */

  nowPlaying.innerHTML = "";


  const originalUrl =
    radio.enlace;


  const streamUrl =
    WORKER_URL +
    encodeURIComponent(
      originalUrl
    );


  player.pause();


  player.src =
    streamUrl;


  player.load();


  player.play()
    .then(() => {


      playButton.innerHTML =
        `<span>⏸️</span> Pausar`;


      /* Guardar radio */

      localStorage.setItem(
        "lastStation",
        radio.enlace
      );


      localStorage.setItem(
        "lastName",
        radio.descripcion
      );


      localStorage.setItem(
        "lastLogo",
        radio.logo || ""
      );


      mostrarLogo(
        radio.logo
      );


      /*
         Ahora sí:
         la radio está reproduciendo,
         por lo que consultamos metadata.
      */

      actualizarMetadata(
        radio
      );


      updateMediaSession(
        radio.descripcion,
        getLogoUrl(
          radio.logo
        )
      );

    })
    .catch(err => {

      console.error(
        "Error al reproducir:",
        err
      );


      /*
         Si no pudo comenzar la reproducción,
         tampoco mostramos metadata.
      */

      nowPlaying.innerHTML = "";


      alert(
        "No se pudo reproducir la emisora. Tocá el botón nuevamente."
      );

    });

}


/* ============================================================
   PAUSAR
   ============================================================ */

function pauseStation() {

  player.pause();


  /*
     Al pausar desaparece el programa.
  */

  nowPlaying.innerHTML = "";


  playButton.innerHTML =
    `<span>▶️</span> Reproducir`;


  if (
    'mediaSession' in navigator
  ) {

    navigator.mediaSession.playbackState =
      'paused';

  }

}


/* ============================================================
   PLAY / PAUSE
   ============================================================ */

playButton.addEventListener(
  'click',
  () => {

    const radio =
      getCurrentRadio();


    if (!radio) {

      alert(
        "Seleccioná una emisora."
      );

      return;

    }


    if (player.paused) {


      if (!player.src) {

        playStation(
          radio
        );

      } else {

        player.play()
          .then(() => {

            playButton.innerHTML =
              `<span>⏸️</span> Pausar`;


            /*
               Ahora que realmente está
               reproduciendo, consultamos metadata.
            */

            actualizarMetadata(
              radio
            );

          })
          .catch(err => {

            console.error(
              "Error:",
              err
            );


            nowPlaying.innerHTML =
              "";

          });

      }

    } else {

      pauseStation();

    }

  }
);


/* ============================================================
   CAMBIO DE RADIO
   ============================================================ */

list.addEventListener(
  'change',
  () => {

    /*
       Limpiar inmediatamente el programa
       de la emisora anterior.
    */

    nowPlaying.innerHTML = "";


    const radio =
      getCurrentRadio();


    if (radio) {

      playStation(
        radio
      );

    }

  }
);


/* ============================================================
   ANTERIOR / SIGUIENTE
   ============================================================ */

function playByIndex(index) {

  if (
    radios.length === 0
  ) {

    return;

  }


  if (index < 0) {

    index =
      radios.length - 1;

  }


  if (
    index >= radios.length
  ) {

    index = 0;

  }


  list.selectedIndex =
    index;


  const radio =
    radios[index];


  playStation(
    radio
  );

}


/* ============================================================
   SIGUIENTE
   ============================================================ */

nextButton.addEventListener(
  'click',
  () => {

    let nextIndex =
      list.selectedIndex + 1;


    if (
      nextIndex >= radios.length
    ) {

      nextIndex = 0;

    }


    playByIndex(
      nextIndex
    );

  }
);


/* ============================================================
   ANTERIOR
   ============================================================ */

prevButton.addEventListener(
  'click',
  () => {

    let prevIndex =
      list.selectedIndex - 1;


    if (
      prevIndex < 0
    ) {

      prevIndex =
        radios.length - 1;

    }


    playByIndex(
      prevIndex
    );

  }
);


/* ============================================================
   ERROR DEL REPRODUCTOR
   ============================================================ */

player.addEventListener(
  'error',
  () => {

    /*
       Si hay error, tampoco debe quedar
       visible el programa anterior.
    */

    nowPlaying.innerHTML = "";


    alert(
      'Hubo un error al cargar el stream. Probá otra emisora.'
    );


    pauseStation();


    if (
      'mediaSession' in navigator
    ) {

      navigator.mediaSession.metadata =
        new MediaMetadata({

          title:
            'Error en la emisora',

          artist:
            'No se pudo reproducir la señal',

          artwork: [

            {

              src:
                'icon.png',

              sizes:
                '512x512',

              type:
                'image/png'

            }

          ]

        });

    }

  }
);


/* ============================================================
   MEDIA SESSION
   ============================================================ */

function updateMediaSession(
  title,
  artwork
) {

  if (
    !('mediaSession' in navigator)
  ) {

    return;

  }


  navigator.mediaSession.metadata =
    new MediaMetadata({

      title:
        title || 'Radio SMG',

      artist:
        'Tu Radio Online',

      artwork: [

        {

          src:
            getSafeLogo(
              artwork ||
              'icon.png'
            ),

          sizes:
            '512x512',

          type:
            'image/png'

        }

      ]

    });


  /* PLAY */

  navigator.mediaSession.setActionHandler(
    'play',
    () => {

      const radio =
        getCurrentRadio();


      if (!radio) {
        return;
      }


      player.play()
        .then(() => {

          playButton.innerHTML =
            `<span>⏸️</span> Pausar`;

          
          /*
             También actualizamos metadata
             cuando se reanuda desde Media Session.
          */

          actualizarMetadata(
            radio
          );

        });

    }
  );


  /* PAUSE */

  navigator.mediaSession.setActionHandler(
    'pause',
    () => {

      pauseStation();

    }
  );


  /* SIGUIENTE */

  navigator.mediaSession.setActionHandler(
    'nexttrack',
    () => {

      let nextIndex =
        list.selectedIndex + 1;


      if (
        nextIndex >= radios.length
      ) {

        nextIndex = 0;

      }


      playByIndex(
        nextIndex
      );

    }
  );


  /* ANTERIOR */

  navigator.mediaSession.setActionHandler(
    'previoustrack',
    () => {

      let prevIndex =
        list.selectedIndex - 1;


      if (
        prevIndex < 0
      ) {

        prevIndex =
          radios.length - 1;

      }


      playByIndex(
        prevIndex
      );

    }
  );

}


/* ============================================================
   LOGO SEGURO
   ============================================================ */

function getSafeLogo(url) {

  try {

    return new URL(
      url,
      location.href
    ).href;

  } catch {

    return 'icon.png';

  }

}


/* ============================================================
   SERVICE WORKER
   ============================================================ */

if (
  'serviceWorker' in navigator
) {

  navigator.serviceWorker
    .register(
      'service-worker.js'
    )
    .catch(() => {});

}


/* ============================================================
   CARGAR RADIOS
   ============================================================ */

cargarRadios();


/* ============================================================
   NOTICIAS
   ============================================================ */

let noticias = [];

let indiceNoticia = 0;


const apiKey =
  "pub_ebffaca675dd4f2a91c4e96e7656ef14";


const rssFeeds = [

  {

    tipo:
      "rss",

    url:
      "https://api.rss2json.com/v1/api.json?rss_url=https://www.clarin.com/rss/lo-ultimo/"

  },

  {

    tipo:
      "newsdata",

    url:
      `https://newsdata.io/api/1/news?apikey=${apiKey}&country=ar&language=es`

  }

];


let feedIndex = 0;


/* ============================================================
   CARGAR NOTICIAS
   ============================================================ */

async function cargarNoticias() {

  const feed =
    rssFeeds[feedIndex];


  let url =
    feed.url;


  try {

    const resp =
      await fetch(url);


    const data =
      await resp.json();


    /* ========================================================
       NEWSDATA
       ======================================================== */

    if (
      feed.tipo ===
      "newsdata"
    ) {

      if (
        !data.results
      ) {

        return;

      }


      noticias =
        data.results.map(
          n => ({

            title:
              n.title ||
              "Sin título",

            description:
              (n.description || "")
                .slice(0, 140) +
              "...",

            image_url:
              n.image_url ||
              "https://picsum.photos/600/400?random=" +
              Math.random(),

            link:
              n.link ||
              "#"

          })
        );

    }


    /* ========================================================
       RSS
       ======================================================== */

    if (
      feed.tipo ===
      "rss"
    ) {

      if (
        !data.items
      ) {

        return;

      }


      noticias =
        data.items.map(
          n => ({

            title:
              n.title,

            description:
              n.description
                .replace(
                  /<[^>]+>/g,
                  ""
                )
                .slice(
                  0,
                  140
                ) +
              "...",

            image_url:
              "https://picsum.photos/600/400?random=" +
              Math.random(),

            link:
              n.link

          })
        );

    }


    indiceNoticia = 0;


    mostrarNoticia();


  } catch (e) {

    console.error(
      "Error cargando noticias:",
      e
    );

  }


  feedIndex =
    (feedIndex + 1) %
    rssFeeds.length;

}


/* ============================================================
   MOSTRAR NOTICIA
   ============================================================ */

function mostrarNoticia() {

  if (
    noticias.length === 0
  ) {

    return;

  }


  const n =
    noticias[indiceNoticia];


  document.getElementById(
    "news-container"
  ).innerHTML = `

    <div class="news-card">

      <img
        class="news-img"
        src="${n.image_url}"
        alt="Imagen noticia"
      >

      <div class="news-content">

        <h2 class="news-title">
          ${n.title}
        </h2>

        <p class="news-desc">
          ${n.description}
        </p>

        <a
          class="news-link"
          href="${n.link}"
          target="_blank"
        >
          Ver más
        </a>

      </div>

    </div>

  `;


  indiceNoticia =
    (indiceNoticia + 1) %
    noticias.length;

}


/* ============================================================
   EJECUTAR NOTICIAS
   ============================================================ */

cargarNoticias();


/* ============================================================
   CAMBIAR NOTICIA CADA 10 SEGUNDOS
   ============================================================ */

setInterval(
  mostrarNoticia,
  10000
);


/* ============================================================
   CAMBIAR FUENTE CADA 1 MINUTO
   ============================================================ */

setInterval(
  cargarNoticias,
  60000
);


</script>

</body>
</html>
