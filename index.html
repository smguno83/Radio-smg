<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Radio SMG</title>

  <!-- iPhone / PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Radio SMG">

  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: #08090c;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #172033 0%, transparent 35%),
        radial-gradient(circle at top right, #111827 0%, transparent 30%),
        linear-gradient(180deg, #08090c 0%, #0d1016 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding-bottom: 115px;
    }

    button,
    input {
      font-family: inherit;
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .topbar {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 18px 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, #19c7a3, #1688ff);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(24, 190, 166, 0.20);
    }

    .brand-icon i {
      font-size: 20px;
      color: white;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .brand-text span {
      display: block;
      color: #8d96a6;
      font-size: 11px;
      margin-top: 1px;
    }

    .settings-button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 14px;
      background: rgba(255,255,255,0.07);
      color: #cdd3dc;
      cursor: pointer;
      font-size: 17px;
    }

    .settings-button:active {
      transform: scale(0.94);
    }

    /* =========================================================
       MAIN
    ========================================================= */

    .main {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 5px 16px 30px;
    }

    .section {
      margin-top: 22px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 11px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 750;
      margin: 0;
      letter-spacing: -0.2px;
    }

    .section-subtitle {
      color: #747e8e;
      font-size: 12px;
    }

    /* =========================================================
       CURRENT RADIO
    ========================================================= */

    .current-card {
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.08),
          rgba(255,255,255,0.025)
        );
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 24px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 17px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.25);
    }

    .current-logo {
      width: 78px;
      height: 78px;
      border-radius: 20px;
      object-fit: contain;
      background: #11151c;
      padding: 8px;
      flex-shrink: 0;
      display: none;
    }

    .current-info {
      min-width: 0;
      flex: 1;
    }

    .current-label {
      color: #6fd8c5;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .current-name {
      font-size: 19px;
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .current-province {
      color: #8b94a3;
      font-size: 12px;
      margin-top: 3px;
    }

    .current-status {
      color: #687384;
      font-size: 11px;
      margin-top: 8px;
    }

    /* =========================================================
       FAVORITES
    ========================================================= */

    .favorites-scroll {
      display: flex;
      gap: 11px;
      overflow-x: auto;
      padding: 2px 1px 8px;
      scrollbar-width: none;
    }

    .favorites-scroll::-webkit-scrollbar {
      display: none;
    }

    .favorite-card {
      min-width: 125px;
      max-width: 125px;
      padding: 12px;
      border-radius: 18px;
      background: rgba(255,255,255,0.055);
      border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transition: 0.18s;
    }

    .favorite-card:active {
      transform: scale(0.96);
    }

    .favorite-logo {
      width: 62px;
      height: 62px;
      display: block;
      margin: 0 auto 9px;
      border-radius: 17px;
      object-fit: contain;
      background: #11151c;
      padding: 6px;
    }

    .favorite-name {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .favorite-province {
      color: #737d8d;
      font-size: 10px;
      margin-top: 3px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-favorites {
      width: 100%;
      padding: 17px;
      border-radius: 17px;
      background: rgba(255,255,255,0.035);
      border: 1px dashed rgba(255,255,255,0.09);
      color: #7e8795;
      font-size: 12px;
      text-align: center;
    }

    /* =========================================================
       SEARCH
    ========================================================= */

    .search-box {
      position: relative;
      margin-bottom: 12px;
    }

    .search-box i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #6e7888;
      font-size: 14px;
    }

    #stationSearch {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.07);
      outline: none;
      border-radius: 16px;
      background: rgba(255,255,255,0.055);
      color: white;
      padding: 13px 15px 13px 42px;
      font-size: 14px;
    }

    #stationSearch::placeholder {
      color: #687384;
    }

    #stationSearch:focus {
      border-color: rgba(25,199,163,0.5);
    }

    /* =========================================================
       STATIONS
    ========================================================= */

    .stations-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .station-item {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.055);
      background: rgba(255,255,255,0.045);
      border-radius: 17px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: 0.18s;
    }

    .station-item:active {
      transform: scale(0.985);
    }

    .station-item.active {
      border-color: rgba(25,199,163,0.45);
      background:
        linear-gradient(
          90deg,
          rgba(25,199,163,0.13),
          rgba(255,255,255,0.045)
        );
    }

    .station-logo {
      width: 52px;
      height: 52px;
      border-radius: 15px;
      object-fit: contain;
      background: #10141b;
      padding: 6px;
      flex-shrink: 0;
    }

    .station-info {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .station-name {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .station-province {
      color: #788292;
      font-size: 11px;
      margin-top: 4px;
    }

    .station-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .favorite-button {
      width: 35px;
      height: 35px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: #657080;
      font-size: 15px;
      cursor: pointer;
    }

    .favorite-button.active {
      color: #ffd45c;
    }

    .station-play {
      width: 37px;
      height: 37px;
      border: 0;
      border-radius: 50%;
      background: #19c7a3;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* =========================================================
       LOADING / ERROR
    ========================================================= */

    #loading {
      text-align: center;
      color: #8993a2;
      font-size: 13px;
      padding: 18px 0;
    }

    #errorMessage {
      display: none;
      color: #ff7777;
      text-align: center;
      font-size: 13px;
      padding: 12px;
    }

    /* =========================================================
       NEWS
    ========================================================= */

    .news-card {
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0,0,0,0.22);
    }

    .news-img {
      width: 100%;
      height: 185px;
      display: block;
      object-fit: cover;
      background: #12161d;
    }

    .news-content {
      padding: 15px;
    }

    .news-title {
      font-size: 16px;
      line-height: 1.35;
      margin: 0 0 8px;
    }

    .news-desc {
      font-size: 12px;
      line-height: 1.5;
      color: #9ba4b2;
      margin: 0 0 12px;
    }

    .news-link {
      color: #55b9ff;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    /* =========================================================
       HIDDEN AUDIO
    ========================================================= */

    #player {
      display: none;
    }

    #stationList {
      display: none;
    }

    /* =========================================================
       BOTTOM PLAYER
    ========================================================= */

    .bottom-player {
      position: fixed;
      z-index: 1000;
      left: 0;
      right: 0;
      bottom: 0;
      padding:
        10px
        14px
        calc(10px + env(safe-area-inset-bottom));
      background: rgba(10,12,17,0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .bottom-player-inner {
      width: 100%;
      max-width: 700px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mini-logo {
      width: 46px;
      height: 46px;
      border-radius: 13px;
      object-fit: contain;
      background: #151922;
      padding: 5px;
      flex-shrink: 0;
    }

    .mini-info {
      flex: 1;
      min-width: 0;
    }

    .mini-name {
      font-size: 13px;
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-status {
      color: #737e8e;
      font-size: 10px;
      margin-top: 3px;
    }

    .player-button {
      width: 43px;
      height: 43px;
      border: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    #prevButton,
    #nextButton {
      background: rgba(255,255,255,0.08);
      color: #d7dce4;
      font-size: 13px;
    }

    #playButton {
      background: #19c7a3;
      color: white;
      font-size: 16px;
      box-shadow: 0 5px 18px rgba(25,199,163,0.25);
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (min-width: 600px) {

      .topbar {
        padding-top: 24px;
      }

      .main {
        padding-left: 20px;
        padding-right: 20px;
      }

      .current-card {
        padding: 23px;
      }

    }

  </style>
</head>

<body>

  <!-- =========================================================
       HEADER
  ========================================================= -->

  <header class="topbar">

    <div class="brand">

      <div class="brand-icon">
        <i class="fa-solid fa-radio"></i>
      </div>

      <div class="brand-text">
        <h1>Radio SMG</h1>
        <span>Tu radio, estés donde estés</span>
      </div>

    </div>

    <button
      class="settings-button"
      id="settingsButton"
      aria-label="Configuración"
      title="Configuración"
    >
      <i class="fa-solid fa-gear"></i>
    </button>

  </header>


  <!-- =========================================================
       MAIN
  ========================================================= -->

  <main class="main">

    <!-- RADIO ACTUAL -->

    <section class="section">

      <div class="current-card">

        <img
          id="stationLogo"
          class="current-logo"
          src=""
          alt="Logo emisora"
        >

        <div class="current-info">

          <div class="current-label">
            <i class="fa-solid fa-circle"></i>
            Radio seleccionada
          </div>

          <div
            id="currentName"
            class="current-name"
          >
            Seleccioná una emisora
          </div>

          <div
            id="currentProvince"
            class="current-province"
          >
            -
          </div>

          <div
            id="nowPlaying"
            class="current-status"
          >
            Lista para reproducir
          </div>

        </div>

      </div>

    </section>


    <!-- FAVORITOS -->

    <section class="section">

      <div class="section-header">

        <h2 class="section-title">
          ⭐ Tus radios favoritas
        </h2>

      </div>

      <div
        id="favoritesContainer"
        class="favorites-scroll"
      ></div>

    </section>


    <!-- TODAS LAS RADIOS -->

    <section class="section">

      <div class="section-header">

        <h2 class="section-title">
          📻 Todas las radios
        </h2>

        <span
          id="radioCount"
          class="section-subtitle"
        ></span>

      </div>


      <div class="search-box">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
          type="search"
          id="stationSearch"
          placeholder="Buscar emisora..."
          autocomplete="off"
        >

      </div>


      <div
        id="loading"
      >
        Cargando emisoras...
      </div>

      <div
        id="errorMessage"
      ></div>


      <div
        id="stationsContainer"
        class="stations-list"
      ></div>

    </section>


    <!-- NOTICIAS -->

    <section class="section">

      <div class="section-header">

        <h2 class="section-title">
          📰 Noticias
        </h2>

      </div>

      <div id="news-container"></div>

    </section>

  </main>


  <!-- =========================================================
       SELECT OCULTO
       Se mantiene porque la lógica original utiliza selectedIndex.
  ========================================================= -->

  <select id="stationList">
    <option value="">Seleccioná una emisora</option>
  </select>


  <!-- =========================================================
       AUDIO
  ========================================================= -->

  <audio
    id="player"
    preload="none"
    playsinline
  ></audio>


  <!-- =========================================================
       BOTTOM PLAYER
  ========================================================= -->

  <div class="bottom-player">

    <div class="bottom-player-inner">

      <img
        id="miniLogo"
        class="mini-logo"
        src="icon.png"
        alt="Radio"
      >

      <div class="mini-info">

        <div
          id="miniName"
          class="mini-name"
        >
          Radio SMG
        </div>

        <div
          id="miniStatus"
          class="mini-status"
        >
          Seleccioná una emisora
        </div>

      </div>

      <button
        id="prevButton"
        class="player-button"
        aria-label="Radio anterior"
      >
        <i class="fa-solid fa-backward-step"></i>
      </button>

      <button
        id="playButton"
        class="player-button"
        aria-label="Reproducir"
      >
        <i class="fa-solid fa-play"></i>
      </button>

      <button
        id="nextButton"
        class="player-button"
        aria-label="Radio siguiente"
      >
        <i class="fa-solid fa-forward-step"></i>
      </button>

    </div>

  </div>


<script>

/* ============================================================
   CONFIGURACIÓN
============================================================ */

const SUPABASE_URL =
  "https://kzcnkktttazibhnqfxvq.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_stHEaVggW8TWfKMrTOW0OQ_QoOB4y8f";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

const WORKER_URL =
  "https://cool-fire-ed4b.matiasgutierrez402.workers.dev/?url=";

const LOGOS_BUCKET = "logos";


/* ============================================================
   CONFIGURACIÓN DE METADATA
   IMPORTANTE:
   La metadata NO controla el reproductor.
============================================================ */

const TRITON_NOW_PLAYING_URL =
  "https://np.tritondigital.com/public/nowplaying";

const METADATA_LA100 =
  "FM999_56AAC";

const METADATA_INTERVAL =
  30000;


/* ============================================================
   ELEMENTOS
============================================================ */

const player =
  document.getElementById("player");

const list =
  document.getElementById("stationList");

const playButton =
  document.getElementById("playButton");

const prevButton =
  document.getElementById("prevButton");

const nextButton =
  document.getElementById("nextButton");

const logoImg =
  document.getElementById("stationLogo");

const miniLogo =
  document.getElementById("miniLogo");

const miniName =
  document.getElementById("miniName");

const miniStatus =
  document.getElementById("miniStatus");

const currentName =
  document.getElementById("currentName");

const currentProvince =
  document.getElementById("currentProvince");

const nowPlaying =
  document.getElementById("nowPlaying");

const loading =
  document.getElementById("loading");

const errorMessage =
  document.getElementById("errorMessage");

const stationsContainer =
  document.getElementById("stationsContainer");

const favoritesContainer =
  document.getElementById("favoritesContainer");

const stationSearch =
  document.getElementById("stationSearch");

const radioCount =
  document.getElementById("radioCount");

const settingsButton =
  document.getElementById("settingsButton");


/* ============================================================
   VARIABLES
============================================================ */

let radios = [];

let noticias = [];

let indiceNoticia = 0;

let feedIndex = 0;

let metadataTimer = null;

const FAVORITES_KEY =
  "radioSMGFavorites";


/* ============================================================
   LOGOS
============================================================ */

function getLogoUrl(nombreLogo) {

  if (!nombreLogo) {
    return null;
  }

  if (
    nombreLogo.startsWith("http://") ||
    nombreLogo.startsWith("https://")
  ) {
    return nombreLogo;
  }

  return `${SUPABASE_URL}/storage/v1/object/public/${LOGOS_BUCKET}/${encodeURIComponent(nombreLogo)}`;
}


/* ============================================================
   FAVORITOS
============================================================ */

function getFavorites() {

  try {

    const data =
      localStorage.getItem(FAVORITES_KEY);

    if (!data) {
      return [];
    }

    const result =
      JSON.parse(data);

    return Array.isArray(result)
      ? result
      : [];

  } catch {

    return [];

  }
}


function saveFavorites(favorites) {

  localStorage.setItem(
    FAVORITES_KEY,
    JSON.stringify(favorites)
  );

}


function isFavorite(radioId) {

  return getFavorites()
    .includes(String(radioId));

}


function toggleFavorite(radioId) {

  const id =
    String(radioId);

  let favorites =
    getFavorites();

  if (favorites.includes(id)) {

    favorites =
      favorites.filter(
        x => x !== id
      );

  } else {

    favorites.push(id);

  }

  saveFavorites(favorites);

  renderFavorites();

  renderStations(
    stationSearch.value
  );

}


/* ============================================================
   CARGAR RADIOS
============================================================ */

async function cargarRadios() {

  loading.style.display =
    "block";

  errorMessage.style.display =
    "none";

  try {

    const { data, error } =
      await supabaseClient
        .from("radios")
        .select(
          "id, descripcion, provincia, enlace, logo, codigo"
        )
        .order(
          "codigo",
          {
            ascending: true
          }
        );

    if (error) {
      throw error;
    }

    if (
      !data ||
      data.length === 0
    ) {

      throw new Error(
        "No se encontraron emisoras."
      );

    }

    radios = data;

    list.innerHTML = "";

    radios.forEach(
      radio => {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          radio.enlace || "";

        option.textContent =
          `${radio.descripcion} - ${radio.provincia}`;

        option.dataset.logo =
          getLogoUrl(
            radio.logo
          );

        option.dataset.id =
          radio.id;

        option.dataset.codigo =
          radio.codigo;

        option.dataset.descripcion =
          radio.descripcion;

        option.dataset.provincia =
          radio.provincia;

        list.appendChild(
          option
        );

      }
    );

    loading.style.display =
      "none";

    radioCount.textContent =
      `${radios.length} emisoras`;

    /*
       Recuperamos la última radio
       SIN reproducir automáticamente.
    */

    const lastStation =
      localStorage.getItem(
        "lastStation"
      );

    if (lastStation) {

      const index =
        radios.findIndex(
          radio =>
            radio.enlace ===
            lastStation
        );

      if (index >= 0) {

        list.selectedIndex =
          index;

      }

    }

    if (
      list.selectedIndex < 0 &&
      radios.length > 0
    ) {

      list.selectedIndex = 0;

    }

    actualizarInterfazRadio();

    renderFavorites();

    renderStations();

  } catch (error) {

    console.error(
      "Error cargando radios:",
      error
    );

    loading.style.display =
      "none";

    errorMessage.textContent =
      "No se pudieron cargar las emisoras.";

    errorMessage.style.display =
      "block";

  }

}


/* ============================================================
   LOGO
============================================================ */

function mostrarLogo(nombreLogo) {

  const logo =
    getLogoUrl(
      nombreLogo
    );

  if (!logo) {

    logoImg.style.display =
      "none";

    miniLogo.src =
      "icon.png";

    return;

  }

  logoImg.onload =
    function() {

      logoImg.style.display =
        "block";

    radios.filter(

          (

        const provincia =
          (

        return (

            );

                    radio.provincia ||

                  data-favorite-id="${radio.id}"

/* ============================================================
   METADATA
   IMPORTANTE:
   Esta función SOLO consulta información.
   Nunca cambia player.src.
   Nunca hace player.load().
   Nunca detiene el audio.
============================================================ */

async function actualizarMetadata(
  radio
) {

  if (!radio) {
    return;
  }

  /*
     Por ahora La 100 es la radio
     que tiene metadata configurada.
  */

  if (
    (
      radio.descripcion ||
      ""
    ).toUpperCase() !== "LA 100"
  ) {

    return;

  }


  try {

    const url =
      `${TRITON_NOW_PLAYING_URL}?mountName=${METADATA_LA100}&numberToFetch=5&eventType=track`;

    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      return;
    }

    const xmlText =
      await response.text();

    const parser =
      new DOMParser();

    const xml =
      parser.parseFromString(
        xmlText,
        "application/xml"
      );

    const registros =
      Array.from(
        xml.querySelectorAll(
          "nowplaying-info"
        )
      );

    if (
      registros.length === 0
    ) {

      return;

    }

    /*
       Verificamos nuevamente qué radio
       está activa, pero NO tocamos el
       reproductor.
    */

    const current =
      getCurrentRadio();

    if (
      !current ||
      current.id !== radio.id
    ) {

      return;

    }

    const primero =
      registros[0];

    const propiedad =
      primero.querySelector(
        'property[name="cue_title"]'
      );

    if (!propiedad) {
      return;
    }

    const titulo =
      propiedad.textContent.trim();

    if (!titulo) {
      return;
    }


    const programaMatch =
      titulo.match(
        /^\d{2}-\d{2}\s+\d{1,2}HS\s+AIRE\s+(.+?)\s+\d{3}$/i
      );


    if (programaMatch) {

      const programa =
        programaMatch[1].trim();

      if (
        programa.toUpperCase() ===
        "LOOP 30 SEGUNDOS"
      ) {

        return;

      }

      nowPlaying.innerHTML =
        `<span>📻 ${escapeHtml(programa)}</span>`;

      miniStatus.textContent =
        `📻 ${programa}`;

      return;

    }


    /*
       Si no reconocemos el formato,
       no hacemos nada con el reproductor.
    */

  } catch (error) {

    /*
       MUY IMPORTANTE:

       Si falla metadata,
       la radio sigue reproduciendo.

       No hacemos alert.
       No pausamos.
       No cambiamos src.
       No hacemos load().
    */

    console.warn(
      "Metadata no disponible:",
      error
    );

  }

}


/* ============================================================
   INICIAR / DETENER ACTUALIZACIÓN DE METADATA
============================================================ */

function iniciarMetadata(
  radio
) {

  detenerMetadata();

  if (!radio) {
    return;
  }

  actualizarMetadata(
    radio
  );

  metadataTimer =
    setInterval(
      () => {

        /*
           Solamente consultamos metadata
           si el audio continúa reproduciendo.
        */

        if (!player.paused) {

          const current =
            getCurrentRadio();

          if (current) {

            actualizarMetadata(
              current
            );

          }

        }

      },
      METADATA_INTERVAL
    );

}


function detenerMetadata() {

  if (metadataTimer) {

    clearInterval(
      metadataTimer
    );

    metadataTimer = null;

  }

}


/* ============================================================
   REPRODUCIR RADIO
   MISMO SISTEMA PARA TODAS LAS RADIOS
============================================================ */

function playStation(
  radio
) {

  if (
    !radio ||
    !radio.enlace
  ) {

    return;

  }


  /*
     Limpiamos solamente la información
     visual de metadata.
  */

  nowPlaying.innerHTML =
    "";


  /*
     STREAM ÚNICO PARA TODAS LAS RADIOS
  */

  const originalUrl =
    radio.enlace;

  const streamUrl =
    WORKER_URL +
    encodeURIComponent(
      originalUrl
    );


  /*
     Detenemos el audio anterior
     y cargamos el nuevo stream.
  */

  player.pause();

  player.src =
    streamUrl;

  player.load();


  /*
     IMPORTANTE:
     La metadata todavía NO interviene.
  */

  player.play()
    .then(
      () => {

        localStorage.setItem(
          "lastStation",
          radio.enlace
        );

        localStorage.setItem(
          "lastName",
          radio.descripcion || ""
        );

        localStorage.setItem(
          "lastLogo",
          radio.logo || ""
        );


        mostrarLogo(
          radio.logo
        );


        actualizarInterfazRadio();


        miniStatus.textContent =
          "Reproduciendo";


        playButton.innerHTML =
          `<i class="fa-solid fa-pause"></i>`;

        playButton.setAttribute(
          "aria-label",
          "Pausar"
        );


        /*
           MediaSession
        */

        updateMediaSession(
          radio.descripcion,
          getLogoUrl(
            radio.logo
          )
        );


        /*
           Metadata queda completamente
           separada del reproductor.
        */

        iniciarMetadata(
          radio
        );


        renderStations(
          stationSearch.value
        );

      }
    )
    .catch(
      error => {

        console.error(
          "Error al reproducir:",
          error
        );

        miniStatus.textContent =
          "No se pudo reproducir";

        playButton.innerHTML =
          `<i class="fa-solid fa-play"></i>`;

        playButton.setAttribute(
          "aria-label",
          "Reproducir"
        );

      }
    );

}


/* ============================================================
   PAUSAR
============================================================ */

function pauseStation() {

  player.pause();

  detenerMetadata();

  nowPlaying.innerHTML =
    "";

  playButton.innerHTML =
    `<i class="fa-solid fa-play"></i>`;

  playButton.setAttribute(
    "aria-label",
    "Reproducir"
  );

  miniStatus.textContent =
    "Pausada";


  if (
    "mediaSession" in navigator
  ) {

    navigator.mediaSession.playbackState =
      "paused";

  }

}

  if (

  list.selectedIndex =

  playStation(
    radio
  );

}

/* ============================================================
   MEDIA SESSION
   Sistema común para TODAS las radios.
============================================================ */

function updateMediaSession(
  title,
  artwork
) {

  if (
    !("mediaSession" in navigator)
  ) {

    return;

  }


  try {

    navigator.mediaSession.metadata =
      new MediaMetadata({

        title:
          title ||
          "Radio SMG",

        artist:
          "Radio SMG",

        album:
          "Radio Online",

        artwork: [
          {
            src:
              getSafeLogo(
                artwork ||
                "icon.png"
              ),
            sizes:
              "512x512",
            type:
              "image/png"
          }
        ]

      });


    navigator.mediaSession.playbackState =
      player.paused
        ? "paused"
        : "playing";


    /*
       PLAY
    */

    try {

      navigator.mediaSession.setActionHandler(
        "play",
        () => {

          const radio =
            getCurrentRadio();

          if (!radio) {
            return;
          }

          player.play()
            .then(
              () => {

                miniStatus.textContent =
                  "Reproduciendo";

                playButton.innerHTML =
                  `<i class="fa-solid fa-pause"></i>`;

                iniciarMetadata(
                  radio
                );

              }
            );

        }
      );

    } catch {}


    /*
       PAUSE
    */

    try {

      navigator.mediaSession.setActionHandler(
        "pause",
        () => {

          pauseStation();

        }
      );

    } catch {}


    /*
       NEXT
    */

    try {

      navigator.mediaSession.setActionHandler(
        "nexttrack",
        () => {

          let nextIndex =
            list.selectedIndex + 1;

          if (
            nextIndex >= radios.length
          ) {

            nextIndex = 0;

          }

          playByIndex(
            nextIndex
          );

        }
      );

    } catch {}


    /*
       PREVIOUS
    */

    try {

      navigator.mediaSession.setActionHandler(
        "previoustrack",
        () => {

          let prevIndex =
            list.selectedIndex - 1;

          if (
            prevIndex < 0
          ) {

            prevIndex =
              radios.length - 1;

          }

          playByIndex(
            prevIndex
          );

        }
      );

    } catch {}


  } catch (error) {

    console.warn(
      "MediaSession no disponible:",
      error
    );

  }

}


/* ============================================================
   LOGO SEGURO
============================================================ */

function getSafeLogo(
  url
) {

  try {

    return new URL(
      url,
      location.href
    ).href;

  } catch {

    return "icon.png";

  }

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text == null
      ? ""
      : String(text);

  return div.innerHTML;

}


function escapeAttribute(
  text
) {

  return escapeHtml(
    text
  ).replace(
    /"/g,
    "&quot;"
  );

}

const apiKey =

const rssFeeds = [

  {

];


async function cargarNoticias() {

  const feed =
    rssFeeds[feedIndex];

  try {

    const resp =
      await fetch(
        feed.url
      );

    const data =
      await resp.json();


    if (
      feed.tipo === "newsdata"
    ) {

      if (!data.results) {
        return;
      }

      noticias =
        data.results.map(
          n => ({

            title:
              n.title ||
              "Sin título",

            description:
              (
                n.description ||
                ""
              )
                .replace(
                  /<[^>]+>/g,
                  ""
                )
                .slice(
                  0,
                  140
                ) +
              "...",

            image_url:
              n.image_url ||
              "icon.png",

            link:
              n.link ||
              "#"

          })
        );

    }


    if (
      feed.tipo === "rss"
    ) {

      if (!data.items) {
        return;
      }

      noticias =
        data.items.map(
          n => ({

            title:
              n.title ||
              "Sin título",

            description:
              (
                n.description ||
                ""
              )
                .replace(
                  /<[^>]+>/g,
                  ""
                )
                .slice(
                  0,
                  140
                ) +
              "...",

            image_url:
              "icon.png",

            link:
              n.link ||
              "#"

          })
        );

    }


    indiceNoticia =
      0;

    mostrarNoticia();


  } catch (error) {

    console.error(
      "Error cargando noticias:",
      error
    );

  }


  feedIndex =
    (
      feedIndex + 1
    ) %
    rssFeeds.length;

}


function mostrarNoticia() {

  if (
    noticias.length === 0
  ) {

    return;

  }


  const n =
    noticias[
      indiceNoticia
    ];


  const safeLink =
    getSafeLink(
      n.link
    );


  document.getElementById(
    "news-container"
  ).innerHTML = `

    <article class="news-card">

      <img
        class="news-img"
        src="${escapeAttribute(
          n.image_url ||
          "icon.png"
        )}"
        alt=""
        onerror="this.src='icon.png'"
      >

      <div class="news-content">

        <h2 class="news-title">
          ${escapeHtml(
            n.title
          )}
        </h2>

        <p class="news-desc">
          ${escapeHtml(
            n.description
          )}
        </p>

        <a
          class="news-link"
          href="${escapeAttribute(
            safeLink
          )}"
          target="_blank"
          rel="noopener noreferrer"
        >
          Ver más
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
        </a>

      </div>

    </article>

  `;


  indiceNoticia =
    (
      indiceNoticia + 1
    ) %
    noticias.length;

}


function getSafeLink(
  url
) {

  try {

    const parsed =
      new URL(
        url,
        location.href
      );

    if (
      parsed.protocol ===
        "http:" ||
      parsed.protocol ===
        "https:"
    ) {

      return parsed.href;

    }

  } catch {}


  return "#";

}


/* ============================================================
   SERVICE WORKER
============================================================ */

if (
  "serviceWorker" in navigator
) {

  navigator.serviceWorker
    .register(
      "service-worker.js"
    )
    .catch(
      error => {

        console.warn(
          "Service Worker:",
          error
        );

      }
    );

}


/* ============================================================
   INICIO
============================================================ */

cargarRadios();

cargarNoticias();


setInterval(
  mostrarNoticia,
  10000
);


setInterval(
  cargarNoticias,
  60000
);

</script>
